/* ---------------------------------------------------------------
   CALCULATION ENGINE
   ----------------------------------------------------------------*/
function computeMonthlyBase(){
  // returns { channelId: { month: {qty, grossSales, netSales} } } and overall by month
  const byChMonth = {};
  const overall = {}; MONTHS.forEach(m=> overall[m] = {qty:0, grossSales:0, discount:0, netSales:0, cogs:0});
  getCycleData('salesInputByCycle').forEach(r=>{
    if(!r.skuId || !r.channelId || !r.month) return;
    const qty = +r.qty || 0;
    const amrp = +r.amrp || 0;
    const acogs = +r.acogs || 0;
    const discPct = +r.discountPct || 0;
    const gross = qty*amrp;
    const disc = gross*discPct/100;
    const net = gross - disc;
    const cogs = qty*acogs;
    byChMonth[r.channelId] = byChMonth[r.channelId] || {};
    byChMonth[r.channelId][r.month] = byChMonth[r.channelId][r.month] || {qty:0,grossSales:0,discount:0,netSales:0,cogs:0};
    const b = byChMonth[r.channelId][r.month];
    b.qty += qty; b.grossSales += gross; b.discount += disc; b.netSales += net; b.cogs += cogs;
    const o = overall[r.month];
    o.qty += qty; o.grossSales += gross; o.discount += disc; o.netSales += net; o.cogs += cogs;
  });
  return {byChMonth, overall};
}

function computeRateCardLines(rateCard, base){
  // returns { lineItemId: { month: amount } } and totals per month
  const lines = {};
  rateCard.forEach(r=>{
    if(!r.channelId || !r.lineItemId) return;
    const chData = base.byChMonth[r.channelId];
    lines[r.lineItemId] = lines[r.lineItemId] || {};
    MONTHS.forEach(m=>{
      const b = (chData && chData[m]) || {qty:0,grossSales:0,netSales:0};
      let amt = 0;
      const rv = +r.rateValue || 0;
      if(r.rateType === 'Value/Unit'){
        amt = b.qty * rv;
      } else { // %
        const baseVal = r.appliedOn === 'Gross Sales' ? b.grossSales : r.appliedOn === 'Qty' ? b.qty : b.netSales;
        amt = baseVal * rv/100;
      }
      lines[r.lineItemId][m] = (lines[r.lineItemId][m]||0) + amt;
    });
  });
  return lines;
}

function computeMiscLines(){
  const lines = {};
  getCycleData('miscInputsByCycle').forEach(r=>{
    if(!r.lineItemId || !r.month) return;
    lines[r.lineItemId] = lines[r.lineItemId] || {};
    lines[r.lineItemId][r.month] = (lines[r.lineItemId][r.month]||0) + (+r.amount||0);
  });
  return lines;
}

function sumMonth(linesObj, month){
  let t=0; Object.values(linesObj).forEach(byM=> t += (byM[month]||0)); return t;
}
function sumAll(linesObj){
  let t=0; Object.values(linesObj).forEach(byM=> MONTHS.forEach(m=> t += (byM[m]||0))); return t;
}
function lineName(id){ const li = DATA.expenseLineItems.find(x=>x.id===id); return li ? li.name : id; }
/* ---------------------------------------------------------------
   P&L CALCULATION ENGINE — GMV through CM1, computed at Pareto
   (Product Sub Category) level per the exact formula chain agreed,
   then summed up to Partner-Model level. CODB/CAC/Opex/EBITDA and
   the cash-flow sections come later.
   ----------------------------------------------------------------*/
function fmt(n){
  n = Math.round(n||0);
  const neg = n<0;
  const s = Math.abs(n).toLocaleString('en-IN');
  return neg ? `(${s})` : s;
}

function getCodbLineItemByName(name){
  return DATA.codbLineItems.find(li=> normalizeText(li.name) === normalizeText(name));
}
function getCodbRate(pmId, li, scId){
  if(!li) return 0;
  const store = getCycleObj('codbRateCardByCycle');
  const effectivePmId = li.allChannel ? ALL_CHANNEL_KEY : pmId;
  return (store[effectivePmId] && store[effectivePmId][li.id] && +store[effectivePmId][li.id][scId]) || 0;
}

// CAC is never part of CODB - matches the exclusion already used for the CODB
// Rate Card and CODB Rate Card screens.
function getCodbLineItemsForPL(){
  return DATA.codbLineItems.filter(li=>{
    if(normalizeText(li.name) === 'cac') return false;
    const exp = DATA.expenseLineItems.find(x=>x.id===li.expenseLineItemId);
    if(exp && exp.type === 'CAC') return false;
    return true;
  });
}

// Same items shown in Miscellaneous Inputs (Type=Misc, minus the CAC/CODB/COGS
// names). These are company-wide monthly amounts, not tied to a Partner-Model
// or Product, so they sit outside the Pareto-level P&L loop entirely and are
// unaffected by the P&L filters above.
function getMiscInputItemsForPL(){
  const excludedNames = ['CAC','CODB','COGS'].map(normalizeText);
  return DATA.expenseLineItems.filter(x=> x.type === 'MISC' && !excludedNames.includes(normalizeText(x.name)));
}
function computeOpexByItem(month){
  const store = getCycleObj('miscInputsByCycle');
  const byItem = {};
  getMiscInputItemsForPL().forEach(li=>{
    byItem[li.id] = +((store[li.id]||{})[month]) || 0;
  });
  return byItem;
}
function computeOpexTotal(month){
  const byItem = computeOpexByItem(month);
  return Object.values(byItem).reduce((a,b)=>a+b, 0);
}

// Dispatches a CODB Line Item's cost by its Rate Basis. All the per-unit bases
// use figures already computed at this same Pareto level (NSV, Gross Qty, COD
// Qty, Returns Qty); "Amt per mth" is a flat amount, entered directly as the
// cost itself, so no multiplication is needed — summing it at Pareto level
// (like everything else) naturally adds up whatever's been entered.
function computeCodbItemCost(li, pmId, scId, ctx){
  const rate = getCodbRate(pmId, li, scId);
  switch(li.rateBasis){
    case '% NSV': return ctx.NSV * rate / 100;
    case 'Rs Per Gross Qty': return ctx.GrossQty * rate;
    case 'Rs Per COD Qty': return ctx.CODQty * rate;
    case 'Rs Per Returns Qty': return ctx.ReturnsQty * rate;
    case 'Amt per mth': return rate;
    default: return 0;
  }
}

function computeParetoLevelPL(pmId, scId, month){
  const gmvByMonth = getCycleObj('monthlyGMVByCycle');
  const chMix = getCycleObj('channelMixByCycle');
  const paretoMixAll = getCycleObj('paretoMixByCycle');
  const mix = paretoMixAll[pmId] || {};
  const subCats = DATA.productSubCategories;
  const pms = DATA.partnerModels;
  const dmg = getCycleObj('discMarginGstByCycle');
  const paretoInput = getCycleObj('paretoInputByCycle');

  // Same GMV-at-Pareto-level formula already used in the Sales Input > Pareto
  // Mix results table: Monthly GMV x Channel Mix% x Pareto Mix%.
  const scPct = getDifferentialPct(subCats, mix, scId, month);
  const channelPct = getDifferentialPct(pms, chMix, pmId, month);
  const channelMonthGMV = (+gmvByMonth[month]||0) * channelPct / 100;
  const GMV = channelMonthGMV * scPct / 100;

  const returnsPct = (dmg.returns && dmg.returns[pmId] && +dmg.returns[pmId][month]) || 0;
  const marginPct = (dmg.margin && dmg.margin[pmId] && +dmg.margin[pmId][month]) || 0;
  const discountPct = (dmg.discount && dmg.discount[pmId] && +dmg.discount[pmId][month]) || 0;
  const codPct = (dmg.codPct && dmg.codPct[pmId] && +dmg.codPct[pmId][month]) || 0;
  const scInput = paretoInput[scId] || {};
  const gstPct = +scInput.gstPct || 0;
  const amrp = +scInput.amrp || 0;
  const acogs = +scInput.acogs || 0;

  const Returns = GMV * returnsPct / 100;
  const base = GMV - Returns;
  const GST = base / (1 + gstPct/100) * (gstPct/100);
  const Margin = base * marginPct / 100;
  const NSV = base - GST - Margin;
  const Discount = discountPct < 100 ? base / (1 - discountPct/100) * (discountPct/100) : 0;
  const MRPVal = NSV + GST + Margin + Discount;
  const NetQty = amrp ? MRPVal / amrp : 0;
  const GrossQty = returnsPct < 100 ? NetQty / (1 - returnsPct/100) : 0;
  const COGS = NetQty * acogs;
  const CM1 = NSV - COGS;

  const CODQty = GrossQty * codPct / 100;
  const ReturnsQty = GrossQty - NetQty;
  const ctx = {NSV, GrossQty, CODQty, ReturnsQty};

  const codbLineItems = getCodbLineItemsForPL();
  const codbByItem = {};
  let CODB = 0;
  codbLineItems.forEach(li=>{
    const cost = computeCodbItemCost(li, pmId, scId, ctx);
    codbByItem[li.id] = cost;
    CODB += cost;
  });
  const CODCharges = codbByItem[(getCodbLineItemByName('COD Charges')||{}).id] || 0;
  const CM2 = CM1 - CODB;

  const cacPct = (dmg.cac && dmg.cac[pmId] && +dmg.cac[pmId][month]) || 0;
  const CAC = GMV * cacPct / 100;
  const CM3 = CM2 - CAC;

  return {GMV, Returns, Discount, Margin, GST, NSV, MRPVal, NetQty, GrossQty, COGS, CM1, CODCharges, CODB, CM2, CAC, CM3, codbByItem};
}

const PL_SUM_KEYS = ['GMV','Returns','Discount','Margin','GST','NSV','MRPVal','NetQty','GrossQty','COGS','CM1','CODCharges','CODB','CM2','CAC','CM3'];
function computePartnerModelPL(pmId, month){
  const subCats = DATA.productSubCategories;
  const totals = {}; PL_SUM_KEYS.forEach(k=> totals[k]=0);
  const codbByItem = {};
  subCats.forEach(sc=>{
    const row = computeParetoLevelPL(pmId, sc.id, month);
    PL_SUM_KEYS.forEach(k=> totals[k] += row[k]);
    Object.keys(row.codbByItem||{}).forEach(liId=>{ codbByItem[liId] = (codbByItem[liId]||0) + row.codbByItem[liId]; });
  });
  totals.codbByItem = codbByItem;
  return totals;
}

function renderPLCFTable(sections, dataProvider){
  let html = `<table class="ledger"><thead><tr><th>₹</th>`;
  MONTHS.forEach(m=> html += `<th>${m}</th>`);
  html += `<th class="total-col">FY Total</th></tr></thead><tbody>`;
  sections.forEach(sec=>{
    html += `<tr class="section"><td>${sec.title}</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
    sec.rows.forEach(r=>{
      if(r.section2){
        html += `<tr class="section2"><td>${r.label}</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
        return;
      }
      const cls = [r.subtotal?'subtotal':'', r.grand?'grand':'', r.indent?'lineitem':''].filter(Boolean).join(' ');
      html += `<tr class="${cls}"><td>${r.label}</td>`;
      const fmtCell = v => r.pct ? (v.toFixed(1)+'%') : (r.ratio ? v.toFixed(2) : fmt(v));
      let rowTotal = 0, hasReal = false;
      MONTHS.forEach(m=>{
        const v = (r.key && dataProvider) ? dataProvider(r.key, m) : null;
        if(v !== null && v !== undefined){ hasReal = true; rowTotal += v; html += `<td>${fmtCell(v)}</td>`; }
        else html += `<td>—</td>`;
      });
      // Ratio/percentage rows don't sum meaningfully across months - recompute
      // from FY-aggregated figures instead of adding up 12 monthly percentages.
      // Balance rows (opening/closing stock, debtors, creditors, GST credit,
      // NWC) shouldn't sum across months either - FY Total shows the opening
      // or closing month's value, since it's a point-in-time balance, not a flow.
      let fyVal = rowTotal;
      let fyReal = hasReal;
      if((r.pct || r.ratio) && r.key && dataProvider){
        const fy = dataProvider(r.key, 'FY');
        if(fy !== null && fy !== undefined){ fyVal = fy; fyReal = true; }
      } else if(r.firstval && r.key && dataProvider){
        for(let mi=0; mi<MONTHS.length; mi++){
          const v = dataProvider(r.key, MONTHS[mi]);
          if(v !== null && v !== undefined){ fyVal = v; fyReal = true; break; }
        }
      } else if(r.endval && r.key && dataProvider){
        for(let mi=MONTHS.length-1; mi>=0; mi--){
          const v = dataProvider(r.key, MONTHS[mi]);
          if(v !== null && v !== undefined){ fyVal = v; fyReal = true; break; }
        }
      }
      html += `<td class="total-col">${fyReal ? fmtCell(fyVal) : '—'}</td></tr>`;
    });
  });
  html += `</tbody></table>`;
  return html;
}

  if(!uptoCM3) return expanded;
  // Keep the P&L section's rows only through CM3 - drop dynamicOpex/EBITDA.
  const cm3Idx = expanded[0].rows.findIndex(r=> r.key === 'CM3');
  const truncatedPL = cm3Idx >= 0 ? expanded[0].rows.slice(0, cm3Idx+1) : expanded[0].rows;
  // Key Ratios only through CM3% - drop EBITDA%.
  const cm3PctIdx = expanded[1].rows.findIndex(r=> r.key === 'CM3Pct');
  const truncatedRatios = cm3PctIdx >= 0 ? expanded[1].rows.slice(0, cm3PctIdx+1) : expanded[1].rows;
  return [
    Object.assign({}, expanded[0], {rows: truncatedPL}),
    Object.assign({}, expanded[1], {rows: truncatedRatios})
  ];
}

const DAYS_IN_MONTH = {Jan:31,Feb:28,Mar:31,Apr:30,May:31,Jun:30,Jul:31,Aug:31,Sep:30,Oct:31,Nov:30,Dec:31};

// ---- Inventory Schedule: sequential month-by-month, company-wide (not PM-specific) ----
function computeInventorySchedule(){
  const inv = getCycleObj('inventoryByCycle');
  const N = MONTHS.length;
  // Pass 1: Outward - Good doesn't depend on inventory state (COGS comes
  // from Sales/Pareto data, MUDA Outward is a direct monthly input), so
  // every month's value can be computed upfront - needed since Inwards now
  // looks FORWARD at future months' Outward - Good to hit the MOS cover target.
  const cogsArr = [], mudaOut = [], outwardGood = [];
  MONTHS.forEach((m)=>{
    const cogs = computeTotalPL(m).COGS;
    const mo = +((inv.mudaOutward||{})[m])||0;
    cogsArr.push(cogs); mudaOut.push(mo);
    outwardGood.push(cogs - mo);
  });

  // Pass 2: walk forward sequentially. Inwards[i] is whatever's needed so
  // that Closing Good covers the next MOS[i] months of Outward - Good.
  const mosArr = MONTHS.map(m=> +((inv.mos||{})[m])||0);
  const opGood=[], opMuda=[], inwards=[], clGood=[], clMuda=[];
  MONTHS.forEach((m,i)=>{
    const og = i===0 ? (+inv.openingGood||0) : clGood[i-1];
    const om = i===0 ? (+inv.openingMuda||0) : clMuda[i-1];
    opGood.push(og); opMuda.push(om);

    const mos = mosArr[i];
    let targetClosing = 0;
    for(let k=1; k<=mos; k++){
      const idx = i+k;
      // Beyond the cycle's last actual month, assume a flat continuation at
      // the last known month's Outward-Good rather than letting cover
      // artificially taper to zero just because the cycle happens to end.
      targetClosing += idx < N ? outwardGood[idx] : outwardGood[N-1];
    }
    const inw = Math.max(0, targetClosing - og + outwardGood[i]);
    inwards.push(inw);

    clGood.push(og + inw - outwardGood[i]);
    clMuda.push(om - mudaOut[i]);
  });
  return {opGood, opMuda, inwards, cogs:cogsArr, mudaOut, clGood, clMuda, mos:mosArr};
}

// ---- GST Input Tax Credit: sequential, nets Input GST against Output GST ----
function computeGstItcSchedule(inventorySched){
  const inv = getCycleObj('inventoryByCycle');
  const openingCredit = +inv.openingGstCredit||0;
  const cogsLine = DATA.expenseLineItems.find(x=>x.type==='COGS');
  const cacLine = DATA.expenseLineItems.find(x=>x.type==='CAC');
  const cogsGstRate = cogsLine ? (+cogsLine.gstRate||0) : 3;
  const cacGstRate = cacLine ? (+cacLine.gstRate||0) : 18;
  const codbGst=[], cacGst=[], opexGst=[], inwardsGst=[], totalInputGst=[], outputGst=[], opITC=[], totalCredit=[], itcUsed=[], cashOutflow=[], clITC=[];
  const opexItems = getMiscInputItemsForPL();
  const opexGstByItem = {}; opexItems.forEach(li=> opexGstByItem[li.id] = []);
  MONTHS.forEach((m,i)=>{
    const totals = computeTotalPL(m);
    let cGst = 0;
    getCodbLineItemsForPL().forEach(li=>{
      const val = totals.codbByItem[li.id] || 0;
      const exp = li.expenseLineItemId ? DATA.expenseLineItems.find(x=>x.id===li.expenseLineItemId) : null;
      const rate = exp ? (+exp.gstRate||0) : 18;
      cGst += val * rate/100;
    });
    codbGst.push(cGst);
    cacGst.push(totals.CAC * cacGstRate/100);
    let oGst = 0;
    opexItems.forEach(li=>{
      const val = computeOpexByItem(m)[li.id] || 0;
      const g = val * (+li.gstRate||0)/100;
      opexGstByItem[li.id].push(g);
      oGst += g;
    });
    opexGst.push(oGst);
    inwardsGst.push(inventorySched.inwards[i] * cogsGstRate/100);
    totalInputGst.push(cGst + totals.CAC*cacGstRate/100 + oGst + inventorySched.inwards[i]*cogsGstRate/100);
    outputGst.push(totals.GST);
    const op = i===0 ? openingCredit : clITC[i-1];
    opITC.push(op);
    const tc = op + totalInputGst[i];
    totalCredit.push(tc);
    const used = Math.min(tc, outputGst[i]);
    itcUsed.push(used);
    cashOutflow.push(Math.max(0, outputGst[i] - used));
    clITC.push(tc - used);
  });
  return {codbGst, cacGst, opexGst, inwardsGst, totalInputGst, outputGst, opITC, totalCredit, itcUsed, cashOutflow, clITC, opexItems, opexGstByItem, cogsGstRate, cacGstRate};
}

// ---- Debtors & Collections: per Partner-Model, then summed to company total ----
function computeDebtorsSchedule(){
  const pms = DATA.partnerModels;
  const debtorsStore = getCycleObj('debtorsByCycle');
  const overrideStore = getCycleObj('debtorsOverrideByCycle');
  const cycle = DATA.aopCycles.find(c=>c.id===DATA.meta.activeCycleId);
  const brandId = cycle ? cycle.brandId : null;
  const N = MONTHS.length;
  const zeros = ()=> new Array(N).fill(0);
  const tot = {opening:zeros(), closing:zeros(), collectible:zeros(), dedn:zeros(), collOpBal:zeros(), collCurrent:zeros(), salesPlusGst:zeros(), adjOverride:zeros()};
  const byPm = [];

  pms.forEach(pm=>{
    const d = debtorsStore[pm.id] || {};
    const ov = overrideStore[pm.id] || {};
    const bpm = DATA.brandPartnerMapping.find(b=> b.brandId===brandId && normalizeText(b.partner)===normalizeText(pm.partner) && normalizeText(b.model)===normalizeText(pm.model));
    const creditDays = bpm ? (+bpm.creditDays||0) : 0;
    const dedItemIds = DATA.marketplaceDeductionMapping.filter(m=> m.brandId===brandId && m.partnerModelId===pm.id).map(m=>m.codbLineItemId);

    const collectible = [], dedn = [], salesPlusGst = [];
    MONTHS.forEach((m,i)=>{
      const pmTotals = computePartnerModelPL(pm.id, m);
      const rev = pmTotals.NSV + pmTotals.GST;
      let ded = 0;
      dedItemIds.forEach(liId=>{
        const li = DATA.codbLineItems.find(x=>x.id===liId);
        if(!li) return;
        if(normalizeText(li.name)==='cac'){
          const cacExpLine = DATA.expenseLineItems.find(x=>x.type==='CAC');
          const cacRate = cacExpLine ? (+cacExpLine.gstRate||0) : 18;
          ded += pmTotals.CAC * (1+cacRate/100);
        } else {
          const val = pmTotals.codbByItem[liId] || 0;
          const exp = li.expenseLineItemId ? DATA.expenseLineItems.find(x=>x.id===li.expenseLineItemId) : null;
          const rate = exp ? (+exp.gstRate||0)/100 : 0.18;
          ded += val * (1+rate);
        }
      });
      collectible.push(Math.max(0, rev - ded));
      dedn.push(ded);
      salesPlusGst.push(rev);
      tot.dedn[i] += ded;
      tot.salesPlusGst[i] += rev;
    });

    const collOpBal = zeros();
    if(N>0) collOpBal[0] += (+d.b030||0);
    if(N>1) collOpBal[1] += (+d.b3160||0);
    // The opening Not Due balance is treated as due uniformly across the
    // credit period itself, starting from cycle start - e.g. 7d credit
    // collects fully in month 1; 45d credit splits across month 1 and 2
    // in proportion to how many of those 45 days fall in each month.
    if(creditDays <= 0){
      if(N>0) collOpBal[0] += (+d.notdue||0);
    } else {
      let elapsed = 0;
      for(let i=0; i<N && elapsed < creditDays; i++){
        const dim = DAYS_IN_MONTH[MONTHS[i]];
        const overlap = Math.max(0, Math.min(elapsed+dim, creditDays) - Math.max(elapsed, 0));
        collOpBal[i] += (+d.notdue||0) * (overlap/creditDays);
        elapsed += dim;
      }
    }

    const collCurrent = zeros();
    for(let j=0;j<N;j++){
      const dimJ = DAYS_IN_MONTH[MONTHS[j]];
      for(let i=j;i<N;i++){
        const daysElapsed = MONTHS.slice(j,i).reduce((a,mm)=>a+DAYS_IN_MONTH[mm],0);
        const dLow = daysElapsed - creditDays;
        const dHigh = daysElapsed + DAYS_IN_MONTH[MONTHS[i]] - creditDays;
        const overlap = Math.max(0, Math.min(dimJ,dHigh) - Math.max(0,dLow));
        collCurrent[i] += collectible[j] * (overlap/dimJ);
      }
    }

    const adjOverride = MONTHS.map(m=> +((ov||{})[m])||0);
    const opening = zeros(), closing = zeros();
    let op = DEBTOR_BUCKETS.reduce((a,b)=>a+(+d[b.key]||0),0);
    MONTHS.forEach((m,i)=>{
      opening[i] = op;
      tot.opening[i] += op;
      tot.collectible[i] += collectible[i];
      tot.collOpBal[i] += collOpBal[i];
      tot.collCurrent[i] += collCurrent[i];
      tot.adjOverride[i] += adjOverride[i];
      const cl = op + collectible[i] - collOpBal[i] - collCurrent[i] - adjOverride[i];
      closing[i] = cl;
      tot.closing[i] += cl;
      op = cl;
    });

    byPm.push({pm, creditDays, opening, collectible, dedn, salesPlusGst, collOpBal, collCurrent, adjOverride, closing});
  });
  tot.byPm = byPm;
  return tot;
}

// ---- Creditors & Payments: per vendor entry, auto-payment schedule from ageing + Credit Days, split COGS vs Others ----
function computeCreditorsSchedule(){
  // Reuses computeCreditorMovementByLine()'s per-Expense-Line groups (which
  // correctly include the vendor-independent "new spend" auto-payment - money
  // still gets paid down on schedule even before any vendor ageing is entered)
  // rather than maintaining a second, parallel calculation that can drift out
  // of sync with the Creditors tab's Movement view, as happened before.
  const N = MONTHS.length;
  const zeros = ()=> new Array(N).fill(0);
  const cogs = {opening:zeros(), closing:zeros(), additions:zeros(), payments:zeros()};
  const others = {opening:zeros(), closing:zeros(), additions:zeros(), payments:zeros()};

  const groups = computeCreditorMovementByLine();
  groups.forEach(g=>{
    const bucket = g.key === '__COGS__' ? cogs : others;
    MONTHS.forEach((m,i)=>{
      bucket.opening[i] += g.opening[i];
      bucket.closing[i] += g.closing[i];
      bucket.additions[i] += g.additions[i];
      bucket.payments[i] += g.totalPayments[i];
    });
  });

  return {cogs, others};
}

// ---- Creditor Movement detail: per Expense Line (CODB, CAC, each Misc item, COGS) ----
// Whichever portion of a Partner-Model's CODB/CAC is netted off before the
// marketplace remits payment (per Marketplace Deduction Mapping) never becomes
// a creditor payable - the company simply receives less, already reflected as
// a deduction in the Debtors schedule. Only the non-deducted portion is owed
// to an actual vendor, so only that portion (and its GST) counts as an addition.
function computeCodbCreditorAdditions(month){
  const cycle = DATA.aopCycles.find(c=>c.id===DATA.meta.activeCycleId);
  const brandId = cycle ? cycle.brandId : null;
  const codbItems = getCodbLineItemsForPL();
  let total = 0;
  DATA.partnerModels.forEach(pm=>{
    const dedItemIds = new Set(DATA.marketplaceDeductionMapping.filter(m=> m.brandId===brandId && m.partnerModelId===pm.id).map(m=>m.codbLineItemId));
    DATA.productSubCategories.forEach(sc=>{
      const row = computeParetoLevelPL(pm.id, sc.id, month);
      codbItems.forEach(li=>{
        if(dedItemIds.has(li.id)) return;
        const val = row.codbByItem[li.id] || 0;
        const exp = li.expenseLineItemId ? DATA.expenseLineItems.find(x=>x.id===li.expenseLineItemId) : null;
        const rate = exp ? (+exp.gstRate||0) : 18;
        total += val * (1+rate/100);
      });
    });
  });
  return total;
}
function computeCacCreditorAdditions(month){
  const cycle = DATA.aopCycles.find(c=>c.id===DATA.meta.activeCycleId);
  const brandId = cycle ? cycle.brandId : null;
  const cacLi = getCodbLineItemByName('CAC');
  const cacExpLine = DATA.expenseLineItems.find(x=>x.type==='CAC');
  const cacRate = cacExpLine ? (+cacExpLine.gstRate||0) : 18;
  let total = 0;
  DATA.partnerModels.forEach(pm=>{
    const isCacDeducted = cacLi && DATA.marketplaceDeductionMapping.some(m=> m.brandId===brandId && m.partnerModelId===pm.id && m.codbLineItemId===cacLi.id);
    if(isCacDeducted) return;
    DATA.productSubCategories.forEach(sc=>{
      total += computeParetoLevelPL(pm.id, sc.id, month).CAC || 0;
    });
  });
  return total * (1+cacRate/100);
}

function getCreditorMovementGroups(){
  const invSchedRef = computeInventorySchedule();
  const codbLine = DATA.expenseLineItems.find(x=>x.type==='CODB');
  const cacLine = DATA.expenseLineItems.find(x=>x.type==='CAC');
  const cogsLine = DATA.expenseLineItems.find(x=>x.type==='COGS');
  const groups = [];
  groups.push({
    key:'__CODB__', label:'CODB',
    creditorDays: codbLine ? numOr(codbLine.creditorDays, 30) : 30,
    gstRateLabel: (codbLine ? (+codbLine.gstRate||0) : 18)+'%',
    additionFn: computeCodbCreditorAdditions
  });
  groups.push({
    key:'__CAC__', label:'CAC',
    creditorDays: cacLine ? numOr(cacLine.creditorDays, 30) : 30,
    gstRateLabel: (cacLine ? (+cacLine.gstRate||0) : 18)+'%',
    additionFn: computeCacCreditorAdditions
  });
  getMiscInputItemsForPL().forEach(li=>{
    groups.push({
      key: li.id, label: li.name, creditorDays: numOr(li.creditorDays, 30), gstRateLabel: (+li.gstRate||0)+'%',
      additionFn: (m)=> (computeOpexByItem(m)[li.id]||0) * (1+(+li.gstRate||0)/100)
    });
  });
  groups.push({
    key:'__COGS__', label:'COGS (Material)',
    creditorDays: cogsLine ? numOr(cogsLine.creditorDays, 30) : 30,
    gstRateLabel: (cogsLine ? (+cogsLine.gstRate||0) : 3)+'%',
    additionFn:(m)=> invSchedRef.inwards[MONTHS.indexOf(m)] * (1 + (cogsLine ? (+cogsLine.gstRate||0) : 3)/100)
  });
  // Catch-all so a vendor pasted against an Expense Line that no longer
  // exists (renamed/deleted) still shows up and still counts toward the
  // total, instead of silently vanishing from this view while still being
  // counted in the Working Capital section's company-wide totals.
  groups.push({
    key:'__UNMATCHED__', label:'Unmatched / No Expense Line', creditorDays:30, gstRateLabel:'—',
    additionFn: ()=>0
  });
  return groups;
}
function vendorGroupKey(e){
  const exp = e.expenseLineId ? DATA.expenseLineItems.find(x=>x.id===e.expenseLineId) : null;
  if(!exp) return '__UNMATCHED__';
  if(exp.type === 'CODB') return '__CODB__';
  if(exp.type === 'CAC') return '__CAC__';
  if(exp.type === 'COGS') return '__COGS__';
  if(exp.type === 'MISC') return exp.id;
  return '__UNMATCHED__';
}
const CREDITOR_SLOT_MAP = {b180p:0, b121180:1, b91120:2, b6190:3, b3160:4, b030:5};
function vendorCreditorDays(e){
  const exp = e.expenseLineId ? DATA.expenseLineItems.find(x=>x.id===e.expenseLineId) : null;
  return exp ? numOr(exp.creditorDays, 30) : 30;
}
// Auto-calculated payment schedule from this vendor's own ageing buckets +
// Creditor Days (the slot-based rule: 0-30 pays month 1, 31-60 pays month 2,
// etc., Not Due pays at the Creditor Days lag).
function vendorAutoPaymentSchedule(e){
  const N = MONTHS.length;
  const lag = Math.floor(vendorCreditorDays(e)/30);
  const sc = new Array(N).fill(0);
  Object.keys(CREDITOR_SLOT_MAP).forEach(bk=>{ const slot=CREDITOR_SLOT_MAP[bk]; if(slot<N) sc[slot]+=(+e[bk]||0); });
  sc[Math.min(lag, N-1)] += (+e.notdue||0);
  return sc;
}
// The actual payment used: an explicit override if set, else the auto schedule.
function vendorEffectivePayments(e){
  const sc = vendorAutoPaymentSchedule(e);
  return MONTHS.map((m,i)=>{
    const override = (e.payments||{})[m];
    return (override!==undefined && override!=='') ? +override : sc[i];
  });
}
function computeCreditorMovementByLine(){
  const entries = getCycleData('creditorsByCycle');
  const pmtOverrideStore = getCycleObj('creditorPmtOverrideByCycle');
  const N = MONTHS.length;
  const zeros = ()=> new Array(N).fill(0);
  const groups = getCreditorMovementGroups();

  const result = groups.map(g=>{
    const vendors = entries.filter(e=> vendorGroupKey(e) === g.key);
    const lag = Math.floor(g.creditorDays/30);
    const pmtsOpBal = zeros();
    let openingTotal = 0;
    vendors.forEach(e=>{
      openingTotal += CREDITOR_BUCKETS.reduce((a,b)=>a+(+e[b.key]||0),0);
      // Op Bal payment is auto-calculated from this vendor's ageing + Creditor
      // Days, but can be edited/uploaded per vendor per month via the Payment
      // Overrides paste box above.
      vendorEffectivePayments(e).forEach((v,i)=>{ pmtsOpBal[i] += v; });
    });

    const additions = MONTHS.map(g.additionFn);
    const pmtsNew = zeros();
    MONTHS.forEach((m,i)=>{ if(i>=lag) pmtsNew[i] = additions[i-lag]; });

    // Pmt Override is a separate, further manual adjustment at the group
    // level - not tied to any individual vendor.
    const pmtOv = pmtOverrideStore[g.key] || {};
    const pmtOverride = MONTHS.map(m=> +(pmtOv[m])||0);

    const totalPayments = zeros();
    MONTHS.forEach((m,i)=>{ totalPayments[i] = pmtsOpBal[i] + pmtsNew[i] + pmtOverride[i]; });

    const opening = zeros(), closing = zeros();
    let op = openingTotal;
    MONTHS.forEach((m,i)=>{
      opening[i] = op;
      const cl = op + additions[i] - totalPayments[i];
      closing[i] = cl;
      op = cl;
    });

    return {label:g.label, key:g.key, vendorCount:vendors.length, creditorDays:g.creditorDays, gstRateLabel:g.gstRateLabel, opening, additions, pmtsOpBal, pmtsNew, pmtOverride, totalPayments, closing};
  });
  return result.filter(g=> g.vendorCount>0 || g.additions.some(v=>v>0.005));
}

  simpleRow('Opening Inventory — MUDA', sched.opMuda, {firstval:true});

    html += `<td><input type="number" step="1" min="0" class="invmoscell" data-month="${m}" value="${sched.mos[i]!==0? sched.mos[i] : ''}"></td>`;

  html += `<td class="total-col">—</td></tr>`;

  // + Inwards - computed, read-only
  html += `<tr><td class="stickyleftcol" style="text-align:left;">+ Inwards (auto)</td>`;
  let inwardsTotal = 0;
  MONTHS.forEach((m,i)=>{
    inwardsTotal += sched.inwards[i];
    html += `<td>${fmt(sched.inwards[i])}</td>`;
  });
  html += `<td class="total-col">${fmt(inwardsTotal)}</td></tr>`;

  const outwardGood = sched.cogs.map((v,i)=> v - sched.mudaOut[i]);
  simpleRow('− Outward — Good', outwardGood, {neg:true});

  // − Outward — MUDA - editable
  html += `<tr><td class="stickyleftcol" style="text-align:left; color:var(--danger, #b3392c);">− Outward — MUDA</td>`;
  let mudaOutTotal = 0;
  MONTHS.forEach((m,i)=>{
    mudaOutTotal += sched.mudaOut[i];
    const dispMo = sched.mudaOut[i]!==0 ? Math.round(sched.mudaOut[i]).toLocaleString('en-IN') : '';

  });
  html += `<td class="total-col">${fmt(mudaOutTotal)}</td></tr>`;

  // Total Outward = Outward Good + Outward MUDA, which by construction is

function renderCollectionsWorkingScreen(container){
  const debSched = computeDebtorsSchedule();

  let html = `<div class="footnote" style="margin-bottom:16px;">Auto-calculated. Use the adjustment row to override collections per Partner-Model per month (e.g. for SOR, MUDA, or aged balances that only move manually).</div>`;

  if(!debSched.byPm.length){
    html += `<div class="footnote">No Partner-Models defined yet.</div>`;
    container.innerHTML = html;
    return;
  }

  html += `<div class="panel" style="max-width:100%;"><div class="scrollbox" style="max-height:75vh; overflow-x:auto;"><table class="ledger compact"><colgroup><col style="width:230px;">${MONTHS.map(()=>'<col style="width:95px;">').join('')}<col style="width:100px;"></colgroup>`;
  html += `<thead><tr><th class="stickyleftcol" style="text-align:left;">Partner — Model</th>`;
  MONTHS.forEach(m=> html += `<th>${m}</th>`);
  html += `<th class="total-col">Total</th></tr></thead><tbody>`;

  debSched.byPm.forEach(pmRow=>{
    const totalCollections = pmRow.collOpBal.map((v,i)=> v + pmRow.collCurrent[i] + pmRow.adjOverride[i]);

    html += `<tr class="section"><td class="stickyleftcol" style="text-align:left; font-weight:700;">${pmRow.pm.partner} — ${pmRow.pm.model} <span class="footnote" style="margin:0;">(${pmRow.creditDays}d credit)</span></td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;

    const simpleRow = (label, values, opts)=>{
      opts = opts || {};
      html += `<tr class="${opts.subtotal?'subtotal':'lineitem'}"><td class="stickyleftcol" style="text-align:left;">${label}</td>`;
      let total = 0;
      values.forEach(v=>{ total += v; html += `<td>${fmt(v)}</td>`; });
      const fyVal = opts.endval ? values[values.length-1] : total;
      html += `<td class="total-col">${fmt(fyVal)}</td></tr>`;
    };

    simpleRow('Opening Debtors', pmRow.opening, {endval:true});
    const nsvByMonth = MONTHS.map(m=> computePartnerModelPL(pmRow.pm.id, m).NSV);
    const gstByMonth = MONTHS.map(m=> computePartnerModelPL(pmRow.pm.id, m).GST);
    simpleRow('+ Revenue (NSV)', nsvByMonth);
    simpleRow('+ GST on Revenue', gstByMonth);
    simpleRow('− Deductions (Mkt)', pmRow.dedn);
    simpleRow('= Collectible (NSV+GST−Ded)', pmRow.collectible, {subtotal:true});
    simpleRow('− Collections (Op Bal)', pmRow.collOpBal);
    simpleRow('− Collections (Current)', pmRow.collCurrent);

    // Adj Override row - editable
    html += `<tr class="lineitem"><td class="stickyleftcol" style="text-align:left;">± Adj Override</td>`;
    let ovTotal = 0;
    MONTHS.forEach((m,i)=>{
      ovTotal += pmRow.adjOverride[i];
      html += `<td><input type="number" step="any" class="debtoradjcell" data-pm="${pmRow.pm.id}" data-month="${m}" value="${pmRow.adjOverride[i]!==0? pmRow.adjOverride[i] : ''}"></td>`;
    });
    html += `<td class="total-col">${fmt(ovTotal)}</td></tr>`;

    simpleRow('= Total Collections', totalCollections, {subtotal:true});
    simpleRow('= Closing Debtors', pmRow.closing, {subtotal:true, endval:true});
  });

  // TOTAL — every Partner-Model summed together, month by month.
  const N = MONTHS.length;
  const sumAcrossPm = key => {
    const arr = new Array(N).fill(0);
    debSched.byPm.forEach(p=> p[key].forEach((v,i)=> arr[i]+=v));
    return arr;
  };
  const totalNsv = new Array(N).fill(0), totalGst = new Array(N).fill(0);
  debSched.byPm.forEach(pmRow=>{
    MONTHS.forEach((m,i)=>{
      const t = computePartnerModelPL(pmRow.pm.id, m);
      totalNsv[i] += t.NSV; totalGst[i] += t.GST;
    });
  });
  const totalOpening = sumAcrossPm('opening');
  const totalDedn = sumAcrossPm('dedn');
  const totalCollectible = sumAcrossPm('collectible');
  const totalCollOpBal = sumAcrossPm('collOpBal');
  const totalCollCurrent = sumAcrossPm('collCurrent');
  const totalAdjOverride = sumAcrossPm('adjOverride');
  const totalClosing = sumAcrossPm('closing');
  const totalTotalCollections = totalCollOpBal.map((v,i)=> v + totalCollCurrent[i] + totalAdjOverride[i]);

  html += `<tr class="grand"><td class="stickyleftcol" style="text-align:left; font-weight:700;">TOTAL — All Partner-Models</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
  const simpleRowTotal = (label, values, opts)=>{
    opts = opts || {};
    html += `<tr class="${opts.subtotal?'subtotal':'lineitem'}"><td class="stickyleftcol" style="text-align:left;">${label}</td>`;
    let total = 0;
    values.forEach(v=>{ total += v; html += `<td>${fmt(v)}</td>`; });
    const fyVal = opts.endval ? values[values.length-1] : total;
    html += `<td class="total-col">${fmt(fyVal)}</td></tr>`;
  };
  simpleRowTotal('Opening Debtors', totalOpening, {endval:true});
  simpleRowTotal('+ Revenue (NSV)', totalNsv);
  simpleRowTotal('+ GST on Revenue', totalGst);
  simpleRowTotal('− Deductions (Mkt)', totalDedn);
  simpleRowTotal('= Collectible (NSV+GST−Ded)', totalCollectible, {subtotal:true});
  simpleRowTotal('− Collections (Op Bal)', totalCollOpBal);
  simpleRowTotal('− Collections (Current)', totalCollCurrent);
  simpleRowTotal('± Adj Override', totalAdjOverride);
  simpleRowTotal('= Total Collections', totalTotalCollections, {subtotal:true});
  simpleRowTotal('= Closing Debtors', totalClosing, {subtotal:true, endval:true});

  html += `</tbody></table></div></div>`;
  container.innerHTML = html;

  container.querySelectorAll('.debtoradjcell').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const store = getCycleObj('debtorsOverrideByCycle');
      if(!store[inp.dataset.pm]) store[inp.dataset.pm] = {};
      const n = cleanNum(inp.value);
      store[inp.dataset.pm][inp.dataset.month] = n===null ? '' : n;
      markDirty();
      renderCollectionsWorkingScreen(container);
    });
  });
}

function renderPLCF(container){
  let html = `<div class="footnote" style="margin-bottom:16px;">GMV through EBITDA are live, computed at Pareto (Product Sub Category) level and summed to the full company total. Cash Flow sections (Debtors, Creditors, Inventory, GST ITC) are now live too, computed per the working-logic model. For a Partner-Model / Product breakdown with filters, see "Partner and Product wise".</div>`;

  // Cash Flow schedules are sequential across months, so compute them once per
  // render rather than recomputing from scratch for every cell.
  const invSched = computeInventorySchedule();
  const gstSched = computeGstItcSchedule(invSched);
  const debSched = computeDebtorsSchedule();
  const credSched = computeCreditorsSchedule();
  const mi = m => MONTHS.indexOf(m);
  const nwcAt = i => (invSched.clGood[i]+invSched.clMuda[i]) + debSched.closing[i] - (credSched.cogs.closing[i]+credSched.others.closing[i]);
  const openingNwcAt = i => (invSched.opGood[i]+invSched.opMuda[i]) + debSched.opening[i] - (credSched.cogs.opening[i]+credSched.others.opening[i]);

  const dataProvider = (key, month)=>{
    if(key && key.indexOf('codbitem_')===0){
      const liId = key.slice('codbitem_'.length);
      return computeTotalPL(month).codbByItem[liId] || 0;
    }
    if(key && key.indexOf('opexitem_')===0){
      const liId = key.slice('opexitem_'.length);
      return computeOpexByItem(month)[liId] || 0;
    }
    if(key === 'EBITDA') return computeTotalPL(month).CM3 - computeOpexTotal(month);
    if(KEY_RATIO_KEYS.includes(key)){
      const totals = month==='FY' ? sumTotalsAcrossMonths(computeTotalPL) : computeTotalPL(month);
      return computeKeyRatios(totals)[key];
    }
    if(key === 'EBITDAPct'){
      const totals = month==='FY' ? sumTotalsAcrossMonths(computeTotalPL) : computeTotalPL(month);
      const opex = month==='FY' ? MONTHS.reduce((a,m)=>a+computeOpexTotal(m),0) : computeOpexTotal(month);
      return totals.NSV ? (totals.CM3 - opex) / totals.NSV * 100 : 0;
    }
    if(PL_SUM_KEYS.includes(key)) return computeTotalPL(month)[key];

    if(month === 'FY') return null; // Cash Flow rows don't have a meaningful FY sum via this path (handled per-row below by renderPLCFTable's own re-sum for non-pct rows)
    const i = mi(month);
    if(i < 0) return null;

    switch(key){
      case 'wcOpInventory': return invSched.opGood[i] + invSched.opMuda[i];
      case 'wcOpDebtors': return debSched.opening[i];
      case 'wcOpCreditors': return credSched.cogs.opening[i] + credSched.others.opening[i];
      case 'wcOpeningNWC': return openingNwcAt(i);

      case 'wcClInventory': return invSched.clGood[i] + invSched.clMuda[i];
      case 'wcClDebtors': return debSched.closing[i];
      case 'wcClCreditors': return credSched.cogs.closing[i] + credSched.others.closing[i];
      case 'wcClosingNWC': return nwcAt(i);
      case 'wcChangeNWC': return openingNwcAt(i) - nwcAt(i);

      case 'itcOpening': return gstSched.opITC[i];
      case 'itcClosing': return gstSched.clITC[i];
      case 'itcChange': return gstSched.opITC[i] - gstSched.clITC[i];

      case 'cfChangeInWC': { const prevNwc = i===0 ? openingNwcAt(0) : nwcAt(i-1); return -(nwcAt(i) - prevNwc); }
      // Debtors track NSV+GST and Creditors track cost+GST, so ΔNWC above already
      // carries a "phantom" GST swing that EBITDA (ex-GST) never had. This line
      // removes that swing (Output GST accrued minus Input GST accrued) and adds
      // back the actual cash GST paid to government, so OCF reconciles to the
      // direct method exactly.
      case 'cfGstCreditCash': return (gstSched.outputGst[i] - gstSched.totalInputGst[i]) - gstSched.cashOutflow[i];
      case 'cfOCF': {
        const ebitda = computeTotalPL(month).CM3 - computeOpexTotal(month);
        const prevNwc = i===0 ? openingNwcAt(0) : nwcAt(i-1);
        const changeInWC = -(nwcAt(i) - prevNwc);
        const gstCredit = (gstSched.outputGst[i] - gstSched.totalInputGst[i]) - gstSched.cashOutflow[i];
        return ebitda + changeInWC + gstCredit;
      }

      case 'cfCollections': return debSched.collOpBal[i] + debSched.collCurrent[i];
      case 'cfPmtMaterial': return -credSched.cogs.payments[i];
      case 'cfPmtOthers': return -credSched.others.payments[i];
      case 'cfGstPayments': return -gstSched.cashOutflow[i];
      case 'cfNetCash': return (debSched.collOpBal[i]+debSched.collCurrent[i]) - credSched.cogs.payments[i] - credSched.others.payments[i] - gstSched.cashOutflow[i];
      case 'cfCheck': {
        const netCash = (debSched.collOpBal[i]+debSched.collCurrent[i]) - credSched.cogs.payments[i] - credSched.others.payments[i] - gstSched.cashOutflow[i];
        const ebitda = computeTotalPL(month).CM3 - computeOpexTotal(month);
        const prevNwc = i===0 ? openingNwcAt(0) : nwcAt(i-1);
        const changeInWC = -(nwcAt(i) - prevNwc);
        const gstCredit = (gstSched.outputGst[i] - gstSched.totalInputGst[i]) - gstSched.cashOutflow[i];
        const ocf = ebitda + changeInWC + gstCredit;
        return netCash - ocf;
      }
    }
    return null;
  };
  html += `<div class="panel"><div class="scrollbox" style="max-height:75vh;">${renderPLCFTable(buildDynamicPLCFSections(false), dataProvider)}</div></div>`;
  container.innerHTML = html;
}

function renderPartnerProductPL(container){
  let html = `<div class="footnote" style="margin-bottom:16px;">GMV through CM3, computed at Pareto (Product Sub Category) level and summed across whatever the filters below select.</div>`;
  html += plFilterBarHtml();
  const dataProvider = (key, month)=>{
    if(key && key.indexOf('codbitem_')===0){
      const liId = key.slice('codbitem_'.length);
      return computeFilteredPL(month).codbByItem[liId] || 0;
    }
    if(KEY_RATIO_KEYS.includes(key)){
      const totals = month==='FY' ? sumTotalsAcrossMonths(computeFilteredPL) : computeFilteredPL(month);
      return computeKeyRatios(totals)[key];
    }
    return PL_SUM_KEYS.includes(key) ? computeFilteredPL(month)[key] : null;
  };
  html += `<div class="panel"><div class="scrollbox" style="max-height:75vh;">${renderPLCFTable(buildDynamicPLCFSections(true), dataProvider)}</div></div>`;
  container.innerHTML = html;

  const wire = (id, filterKey, resetChildren)=>{
    const details = container.querySelector('#'+id);
    if(!details) return;
    // Manual open/close via the summary itself (not a checkbox tick) still
    // needs to be remembered so the next re-render doesn't fight the user.
    details.addEventListener('toggle', ()=>{
      plOpenDropdownId = details.open ? id : (plOpenDropdownId===id ? null : plOpenDropdownId);
    });
    const allCb = details.querySelector('.ms-all');
    const optCbs = details.querySelectorAll('.ms-opt');
    if(allCb) allCb.addEventListener('change', ()=>{
      plOpenDropdownId = id;
      plFilters[filterKey] = [];
      (resetChildren||[]).forEach(k=> plFilters[k]=[]);
      renderPartnerProductPL(container);
    });
    optCbs.forEach(cb=> cb.addEventListener('change', ()=>{
      plOpenDropdownId = id;
      const set = new Set(plFilters[filterKey]);
      if(cb.checked) set.add(cb.value); else set.delete(cb.value);
      plFilters[filterKey] = Array.from(set);
      (resetChildren||[]).forEach(k=> plFilters[k]=[]);
      renderPartnerProductPL(container);
    }));
  };
  wire('plfPartnerGroup', 'partnerGroup', ['partnerModel']);
  wire('plfPartnerModel', 'partnerModel');
  wire('plfProductGroup', 'productGroup', ['productCategory','productSubCategory']);
  wire('plfProductCategory', 'productCategory', ['productSubCategory']);
  wire('plfProductSubCategory', 'productSubCategory');
}

let cycleFormOpen = false;
let cycleVersionType = 'AOP';

function nextLENumber(cycles, brandId, fy){
  let max = 0;
  cycles.filter(c=>c.brandId===brandId && c.fy===fy && /^LE\d+$/.test(c.version||'')).forEach(c=>{
    const n = parseInt(c.version.slice(2), 10);
    if(n > max) max = n;
  });
  return max + 1;
}

function renderCyclePanel(){
  const panel = document.getElementById('cyclePanel');
  if(!panel) return;
  const cycles = DATA.aopCycles || [];

  // If cycles exist but none is active (e.g. right after migrating old data,
  // or the active one was deleted), default to the most recently created one
  // rather than leaving the dropdown selection inconsistent with the data shown.
  if(cycles.length && !cycles.some(c=>c.id===DATA.meta.activeCycleId)){
    DATA.meta.activeCycleId = cycles[cycles.length-1].id;
    applyActiveCycle();
  }
  const active = getActiveCycle();

  let html = '';
  if(cycles.length){
    html += `<select id="cycleSelect">`;
    cycles.forEach(c=>{
      html += `<option value="${c.id}" ${c.id===DATA.meta.activeCycleId?'selected':''}>${cycleLabel(c)}</option>`;
    });
    html += `</select>`;
  }
  html += `<button class="newcyclebtn" id="newCycleBtn">${cycleFormOpen?'✕ Cancel':'+ New Cycle'}</button>`;

  if(cycleFormOpen){
    html += `<div class="cycleform">`;
    if(cycles.length){
      html += `<div class="cyclelabel">Copy from (optional)</div>
      <select id="cycleCopyFrom"><option value="">— Start blank —</option>${cycles.map(c=>`<option value="${c.id}">${cycleLabel(c)}</option>`).join('')}</select>`;
    }
    html += `
      <div class="cyclelabel">Brand</div>
      <select id="cycleBrand">${DATA.brands.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select>
      <div class="cyclelabel">FY</div>
      <select id="cycleFY">${getAvailableFYOptions().map(fy=>`<option value="${fy}">${fy}</option>`).join('')}</select>
      <div class="cyclelabel">Start Month (always ends Mar)</div>
      <select id="cycleStartMonth">${DEFAULT_MONTHS.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
      <div class="cyclelabel">Version</div>
      <div class="versiontoggle">
        <button type="button" class="verbtn ${cycleVersionType==='AOP'?'active':''}" data-vtype="AOP">AOP</button>
        <button type="button" class="verbtn ${cycleVersionType==='LE'?'active':''}" data-vtype="LE">LE</button>
      </div>
      <button class="createbtn" id="createCycleBtn">Create Cycle</button>
    </div>`;
  }

  html += `<div class="cyclesummary">${active ? cycleLabel(active) : 'No cycle selected — using default FY (Apr–Mar)'}</div>`;

  if(active){
    html += `<div class="cycleactions">
      <button class="cycleactionbtn" id="togglePublishBtn">${active.published ? '↩ Unpublish' : '✓ Publish'}</button>
      <button class="cycleactionbtn danger" id="deleteCycleBtn">🗑 Delete</button>
    </div>`;
  }

  panel.innerHTML = html;

  const sel = panel.querySelector('#cycleSelect');
  if(sel) sel.addEventListener('change', ()=>{
    DATA.meta.activeCycleId = sel.value;
    applyActiveCycle();
    markDirty();
    render();
  });

  const publishBtn = panel.querySelector('#togglePublishBtn');
  if(publishBtn) publishBtn.addEventListener('click', ()=>{
    active.published = !active.published;
    markDirty();
    render();
  });

  const deleteBtn = panel.querySelector('#deleteCycleBtn');
  if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
    const ok = confirm(`Delete "${cycleLabel(active)}"?\n\nThis also permanently deletes all Sales Input, Rate Card, Misc Inputs and Cash Flow data entered for this cycle. This cannot be undone.`);
    if(!ok) return;
    const idx = DATA.aopCycles.findIndex(c=>c.id===active.id);
    if(idx > -1) DATA.aopCycles.splice(idx,1);
    ['salesInputByCycle','codbRateCardByCycle','miscInputsByCycle','monthlyGMVByCycle','channelMixByCycle','categoryMixByCycle','paretoMixByCycle','discMarginGstByCycle','paretoInputByCycle','debtorsByCycle','debtorsOverrideByCycle','creditorsByCycle','creditorPmtOverrideByCycle','inventoryByCycle'].forEach(k=>{
      if(DATA[k]) delete DATA[k][active.id];
    });
    if(DATA.meta.activeCycleId === active.id) DATA.meta.activeCycleId = '';
    applyActiveCycle();
    markDirty();
    render();
  });

  panel.querySelector('#newCycleBtn').addEventListener('click', ()=>{
    cycleFormOpen = !cycleFormOpen;
    cycleVersionType = 'AOP';
    renderCyclePanel();
  });

  panel.querySelectorAll('.verbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      cycleVersionType = btn.dataset.vtype;
      renderCyclePanel();
    });
  });

function copyCycleInputData(destCycleId, srcCycleId){
  if(!srcCycleId) return;
  ['salesInputByCycle'].forEach(k=>{
    const srcRows = (DATA[k] && DATA[k][srcCycleId]) || [];
    DATA[k] = DATA[k] || {};
    // Deep-copy with fresh row ids so edits in the new cycle never collide with the source.
    DATA[k][destCycleId] = srcRows.map(r=> ({...r, id: uid('COPY')}));
  });
  ['monthlyGMVByCycle','channelMixByCycle','categoryMixByCycle','paretoMixByCycle','discMarginGstByCycle','codbRateCardByCycle','miscInputsByCycle','paretoInputByCycle','debtorsByCycle','debtorsOverrideByCycle','creditorsByCycle','creditorPmtOverrideByCycle','inventoryByCycle'].forEach(k=>{
    const srcObj = (DATA[k] && DATA[k][srcCycleId]) || {};
    DATA[k] = DATA[k] || {};
    DATA[k][destCycleId] = JSON.parse(JSON.stringify(srcObj));
  });
}

function createAndActivateCycle(brandId, fy, startMonth, version, copyFromId){
  const newCycle = {id: uid('CYC'), brandId, fy, startMonth, version, published:false};
  DATA.aopCycles.push(newCycle);
  copyCycleInputData(newCycle.id, copyFromId);
  DATA.meta.activeCycleId = newCycle.id;
  applyActiveCycle();
  cycleFormOpen = false;
  markDirty();
  render();
}

const copyFromSel = panel.querySelector('#cycleCopyFrom');
  if(copyFromSel) copyFromSel.addEventListener('change', ()=>{
    const src = cycles.find(c=>c.id===copyFromSel.value);
    if(src){
      panel.querySelector('#cycleBrand').value = src.brandId;
      panel.querySelector('#cycleStartMonth').value = src.startMonth || 'Apr';
      // FY and Version are left for the user to set for the new cycle —
      // that's the whole point of using this as a template for the next one.
    }
  });

  const createBtn = panel.querySelector('#createCycleBtn');
  if(createBtn) createBtn.addEventListener('click', ()=>{
    if(!DATA.brands.length){ alert('Add a brand in Brand Master first.'); return; }
    const brandId = panel.querySelector('#cycleBrand').value;
    const fy = panel.querySelector('#cycleFY').value;
    const startMonth = panel.querySelector('#cycleStartMonth').value;
    const copyFromId = copyFromSel ? copyFromSel.value : '';

    if(cycleVersionType === 'AOP'){
      const existingAOP = cycles.find(c=>c.brandId===brandId && c.fy===fy && c.version==='AOP');
      if(existingAOP){
        const brandName = (DATA.brands.find(b=>b.id===brandId)||{}).name || 'this brand';
        const switchInstead = confirm(`An AOP already exists for ${brandName} ${fy}.\n\nOK — switch to it.\nCancel — create a new LE revision instead.`);
        if(switchInstead){
          DATA.meta.activeCycleId = existingAOP.id;
          applyActiveCycle();
          cycleFormOpen = false;
          markDirty();
          render();
          return;
        }
        // Fall through to creating an LE revision instead.
        const n = nextLENumber(cycles, brandId, fy);
        createAndActivateCycle(brandId, fy, startMonth, `LE${n}`, copyFromId);
        return;
      }
      createAndActivateCycle(brandId, fy, startMonth, 'AOP', copyFromId);
      return;
    }

    // LE: auto-numbered, resets per Brand+FY (each new FY starts back at LE1).
    const n = nextLENumber(cycles, brandId, fy);
    createAndActivateCycle(brandId, fy, startMonth, `LE${n}`, copyFromId);
  });
}

const MASTER_TAB_KEYS = MASTER_TABS.map(t=>t.key);
function render(){
  renderCyclePanel();
  document.querySelectorAll('.navitem').forEach(b=>{
    const isActive = b.dataset.tab==='mastersConfig' ? MASTER_TAB_KEYS.includes(activeTab) : b.dataset.tab===activeTab;
    b.classList.toggle('active', isActive);
  });
  const tab = TABS[activeTab];
  document.getElementById('panelTitle').textContent = tab.title;
  document.getElementById('panelSub').textContent = tab.desc;
  const content = document.getElementById('content');
  if(activeTab.startsWith('output')){
    tab.render(content);
  }else if(MASTER_TAB_KEYS.includes(activeTab)){
    content.innerHTML = renderMasterTabBar(activeTab) + `<div class="panel"><div id="tableHost"></div></div>`;
    wireMasterTabBar(content);
    tab.render(document.getElementById('tableHost'));
  }else{
    content.innerHTML = `<div class="panel"><div id="tableHost"></div></div>`;
    tab.render(document.getElementById('tableHost'));
  }
}

document.querySelectorAll('.navitem').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const key = btn.dataset.tab === 'mastersConfig' ? MASTER_TAB_KEYS[0] : btn.dataset.tab;
    setActiveTab(key);
  });
});

document.getElementById('sidebarSaveBtn').addEventListener('click', ()=>{
  if(autosaveTimer) clearTimeout(autosaveTimer);
  saveToGitHub();
});

loadData();
</script>
