<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinFables — Annual Budget Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#EEF1F7;
    --surface:#FFFFFF;
    --ink:#1B2338;
    --ink-soft:#69708A;
    --line:#DEE3ED;
    --accent:#B8863B;
    --accent-dark:#091A2E;
    --accent-soft:#F5EAD3;
    --gold:#0B7A56;
    --gold-soft:#E1F3EC;
    --neg:#B23A3A;
    --neg-soft:#F8E9E9;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(22,32,74,0.06), 0 1px 1px rgba(22,32,74,0.04);
    --shadow-md:0 4px 14px rgba(22,32,74,0.08), 0 1px 3px rgba(22,32,74,0.06);
    --shadow-lg:0 10px 30px rgba(22,32,74,0.14), 0 2px 8px rgba(22,32,74,0.08);
  }
  *{box-sizing:border-box;}
  input[type=checkbox]{accent-color:var(--accent);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Times New Roman', Times, serif;
    font-size:14.5px;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;}

  /* Sidebar */
  .sidebar{
    width:264px; flex:none;
    background:linear-gradient(160deg, #14243F 0%, #091A2E 100%);
    color:#B9C1DC;
    padding:26px 0 24px 0;
    display:flex; flex-direction:column;
    box-shadow: var(--shadow-lg);
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar::after{
    content:''; position:absolute; top:0; right:0; width:1px; height:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0));
  }
  .brandmark{
    font-family:'Times New Roman', Times, serif;
    font-size:22px; font-weight:700; letter-spacing:0.01em;
    padding:0 24px 16px 24px;
    color:#FFFFFF;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin:0 22px 8px 22px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .brandmark .brandicon{width:30px; height:30px; flex:none; border-radius:50%;}
  .brandmark small{display:block; width:100%; font-size:10.5px; color:#8590B3; font-weight:400; margin-top:2px; letter-spacing:0.1em; text-transform:uppercase; font-style:normal; font-family:'Times New Roman', Times, serif;}
  .navgroup{margin-top:22px;}
  .navgroup h4{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em;
    color:#6B76A0; margin:0; padding:8px 24px 8px 24px; font-weight:700;
  }
  .navitem{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:none; border:none;
    color:#B9C1DC; padding:9px 24px; font-size:13.8px; cursor:pointer;
    border-left:3px solid transparent; font-family:inherit;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .navitem svg{width:15px; height:15px; flex:none; opacity:0.8;}
  .navitem span{white-space:normal; line-height:1.25;}
  .navitem:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .navitem:hover svg{opacity:1;}
  .navitem.active{background:linear-gradient(90deg, rgba(184,134,59,0.35), rgba(184,134,59,0.05)); border-left-color:#ECCB7D; color:#fff; font-weight:700;}
  .navitem.active svg{opacity:1; color:#ECCB7D;}

  .sidebarsave{margin-top:auto; padding:18px 22px 4px 22px; border-top:1px solid rgba(255,255,255,0.1);}

  /* AOP Cycle panel */
  .cyclepanel{padding:14px 22px 18px 22px; border-bottom:1px solid rgba(255,255,255,0.1); margin:0 20px 4px 20px;}
  .cyclepanel select{
    width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14);
    color:#fff; padding:7px 9px; border-radius:6px; font-family:'Times New Roman', Times, serif; font-size:12.5px;
    margin-bottom:8px;
  }
  .cyclepanel select:focus{
    background:#1B2A4D; color:#fff; border-color:#ECCB7D; outline:none;
    box-shadow:0 0 0 3px rgba(236,203,125,0.25);
  }
  .cyclepanel select option{color:#1B2338; background:#fff;}
  .cyclepanel .cyclelabel{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:#6B76A0; font-weight:700; margin:8px 0 4px 0;}
  .cyclepanel .cyclesummary{font-size:11px; color:#ECCB7D; font-style:italic; margin-top:6px; line-height:1.4;}
  .cyclepanel .cycleactions{display:flex; gap:6px; margin-top:8px;}
  .cyclepanel .cycleactionbtn{
    flex:1; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.14); color:#B9C1DC;
    padding:6px 8px; border-radius:6px; font-family:'Times New Roman', Times, serif; font-size:11px;
    font-weight:700; cursor:pointer; transition:all 0.15s ease;
  }
  .cyclepanel .cycleactionbtn:hover{border-color:#ECCB7D; color:#fff;}
  .cyclepanel .cycleactionbtn.danger:hover{border-color:var(--neg); color:#F0A0A0;}
  .cyclepanel .newcyclebtn{
    width:100%; background:rgba(236,203,125,0.12); border:1px dashed #ECCB7D; color:#ECCB7D;
    padding:7px 9px; border-radius:6px; font-family:'Times New Roman', Times, serif; font-size:12px; font-weight:700;
    cursor:pointer; margin-bottom:4px; transition:background 0.15s ease;
  }
  .cyclepanel .newcyclebtn:hover{background:rgba(236,203,125,0.22);}
  .cyclepanel .cycleform{margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08);}
  .cyclepanel .createbtn{
    width:100%; background:var(--accent); border:none; color:#fff; padding:8px 9px; border-radius:6px;
    font-family:'Times New Roman', Times, serif; font-size:12.5px; font-weight:700; cursor:pointer; margin-top:4px;
  }
  .cyclepanel .createbtn:hover{background:#A47632;}
  .cyclepanel .versiontoggle{display:flex; gap:6px; margin-bottom:4px;}
  .cyclepanel .verbtn{
    flex:1; padding:7px 0; border-radius:6px; border:1px solid rgba(255,255,255,0.14);
    background:rgba(255,255,255,0.06); color:#B9C1DC; font-family:'Times New Roman', Times, serif;
    font-size:12px; font-weight:700; cursor:pointer; transition:all 0.15s ease;
  }
  .cyclepanel .verbtn:hover{border-color:#ECCB7D; color:#fff;}
  .cyclepanel .verbtn.active{background:var(--accent); color:#fff; border-color:var(--accent-dark);}
  .sidebarsave-status{font-size:10.5px; color:#8590B3; margin-top:8px; text-align:center; font-style:italic; line-height:1.4;}

  /* Main */
  .main{flex:1; min-width:0; padding:22px 28px 44px 28px; overflow-x:auto;}
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:18px; flex-wrap:wrap; gap:12px;
    padding-bottom:12px; border-bottom:1px solid var(--line);
  }
  .titleblock h1{
    font-family:'Times New Roman', Times, serif;
    font-size:21px; margin:0 0 3px 0; font-weight:700;
    color:var(--ink); letter-spacing:0.01em;
  }
  .titleblock .sub{color:var(--ink-soft); font-size:12.5px; font-style:italic;}
  #fileInput{display:none;}

  .btn{
    font-family:'Times New Roman', Times, serif; font-size:12.5px; padding:7px 14px; border-radius:6px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; font-weight:700; transition:all 0.15s ease;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{border-color:var(--accent); color:var(--accent); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(180deg, var(--accent), var(--accent-dark)); color:#fff; border-color:var(--accent-dark);}
  .btn.primary:hover{color:#fff; box-shadow:var(--shadow-md);}
  .btn.danger{background:var(--surface); color:var(--neg); border-color:#E3B8B8;}
  .btn.danger:hover{background:var(--neg-soft); box-shadow:var(--shadow-md);}

  /* Masters & Config: horizontal tab bar */
  .mastertabbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .mastertab{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Times New Roman', Times, serif; font-size:13.5px; font-weight:700;
    padding:9px 16px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); cursor:pointer; transition:all 0.15s ease;
  }
  .mastertab svg{width:14px; height:14px; flex:none; opacity:0.75;}
  .mastertab:hover{border-color:var(--accent); color:var(--accent);}
  .mastertab:hover svg{opacity:1;}
  .mastertab.active{background:linear-gradient(180deg, var(--accent), var(--accent-dark)); color:#fff; border-color:var(--accent-dark); box-shadow:var(--shadow-sm);}
  .mastertab.active svg{opacity:1;}

  /* Pill sub-navigation (e.g. Pareto Master's Product Group / Category / Sub Category) */
  .pillbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; position:sticky; top:0; z-index:8; background:var(--bg); padding:6px 0 10px 0;}
  .pill{
    font-family:'Times New Roman', Times, serif; font-size:13px; font-weight:700;
    padding:8px 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); cursor:pointer; transition:all 0.15s ease;
  }
  .pill:hover{border-color:var(--accent); color:var(--accent);}
  .pill.active{background:var(--accent); color:#fff; border-color:var(--accent-dark); box-shadow:var(--shadow-sm);}

  /* Paste-from-Excel bar — compact, single line */
  .msdropdown{position:relative;}
  .msdropdown summary::-webkit-details-marker{display:none;}
  .msdropdown summary{list-style:none;}
  .msdropdown summary:after{content:'▾'; float:right; color:var(--ink-soft); margin-left:8px;}
  .msdropdown[open] summary{border-color:var(--accent) !important; box-shadow:0 0 0 2px var(--accent-soft);}
  .msdropdown-panel{
    position:absolute; top:calc(100% + 4px); left:0; z-index:20; min-width:220px; max-height:280px; overflow-y:auto;
    background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow-md); padding:6px;
  }
  .msoption{display:flex; align-items:center; gap:8px; padding:5px 8px; font-size:13px; border-radius:5px; cursor:pointer; white-space:nowrap;}
  .msoption:hover{background:var(--accent-soft);}
  .msoption input{margin:0;}

  .pastebox{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); border-radius:6px; padding:4px 6px 4px 10px; margin-bottom:12px; background:#FAFBFD;
  }
  .pastebox-label{font-size:11px; font-weight:700; color:var(--ink-soft); white-space:nowrap; flex:none; max-width:280px; overflow:hidden; text-overflow:ellipsis;}
  .pastebox-row{display:contents;}
  .pastebox textarea{
    flex:1; height:28px; min-height:28px; max-height:28px; resize:none; overflow:hidden; line-height:1.3;
    font-family:'Times New Roman', Times, serif; font-size:12.5px;
    border:1px solid var(--line); border-radius:5px; padding:4px 8px; color:var(--ink); background:#fff;
  }
  .pastebox textarea:focus{
    height:60px; max-height:60px; overflow:auto;
    outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);
  }
  .pastebox-btns{display:flex; gap:6px; flex:none;}

  /* Inline add-row form */
  .addform{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;}
  .addfield{display:flex; flex-direction:column; gap:4px; min-width:130px;}
  .addfield label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.05em;}
  .addfield input,.addfield select{border:1px solid var(--line); border-radius:6px; padding:8px 10px;}
  .addfield input:focus,.addfield select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .invsinglecell{border:1px solid var(--line) !important; border-radius:6px; padding:8px 10px; font-size:14px; color:var(--ink); background:#fff; font-family:'Times New Roman', Times, serif;}
  .invsinglecell:focus{outline:none; border-color:var(--accent) !important; box-shadow:0 0 0 3px var(--accent-soft);}
  .addform .addbtn{align-self:flex-end;}

  .savenote{font-size:11.5px; color:var(--ink-soft); font-style:italic;}

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:16px;
    box-shadow:var(--shadow-sm);
  }
  .panel h2{
    font-family:'Times New Roman', Times, serif;
    font-size:18px; margin:0 0 5px 0; font-weight:700;
  }
  .panel .desc{color:var(--ink-soft); font-size:13px; margin-bottom:16px; font-style:italic;}

  /* KPI cards */
  .kpirow{display:flex; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .kpi{
    flex:1; min-width:170px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 20px; position:relative; overflow:hidden;
    box-shadow:var(--shadow-sm); transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  .kpi:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .kpi::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%;
    background:linear-gradient(180deg, var(--accent), var(--accent-dark));
  }
  .kpi.negtone::before{background:linear-gradient(180deg, var(--neg), #8A2C2C);}
  .kpi .kpilabel{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700; margin-bottom:7px;}
  .kpi .kpival{font-family:'Times New Roman', Times, serif; font-size:23px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .kpi .kpival.neg{color:var(--neg);}
  .kpi .kpisub{font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;}

  table{width:100%; border-collapse:collapse; font-size:13.3px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); border-bottom:2px solid var(--line); padding:9px 10px; font-weight:700;
    white-space:nowrap;
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr{transition:background 0.1s ease;}
  tbody tr:hover{background:#F5F7FC;}
  input[type=text],input[type=number],select{
    width:100%; border:1px solid transparent; background:transparent;
    font-family:'Times New Roman', Times, serif; font-size:13.3px; padding:6px 8px; border-radius:5px; color:var(--ink);
  }
  input[type=text]:hover,input[type=number]:hover,select:hover{border-color:var(--line);}
  input[type=text]:focus,input[type=number]:focus,select:focus{
    outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-soft);
  }
  input[type=number]{font-variant-numeric:tabular-nums; text-align:right; font-family:'Times New Roman', Times, serif; -moz-appearance:textfield;}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .num{font-variant-numeric:tabular-nums; text-align:right; font-family:'Times New Roman', Times, serif;}
  .addform .addfield input[type=text],
  .addform .addfield input[type=number],
  .addform .addfield select{
    border:1px solid var(--line) !important; background:#fff;
  }
  .rowdel{
    border:none; background:none; color:#A6AECB; cursor:pointer; font-size:15px; line-height:1;
    padding:3px 8px; border-radius:5px; transition:all 0.12s ease;
  }
  .rowdel:hover{color:var(--neg); background:var(--neg-soft);}
  .addrow{
    margin-top:14px; font-size:13px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border:1px dashed #A9B7E6; border-radius:7px;
    padding:9px 16px; cursor:pointer; transition:all 0.15s ease;
    font-family:'Times New Roman', Times, serif;
  }
  .addrow:hover{background:#D6DEF5; box-shadow:var(--shadow-sm);}

  /* Masters & Config tables — tighter rows, plain-case headers, fixed column widths */
  .mastertable{table-layout:fixed;}
  .scrollbox{overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius);}
  .scrollbox table{margin:0;}
  .scrollbox thead th{position:sticky; top:0; z-index:2; box-shadow:0 1px 0 var(--line);}
  .stickyleftcol{position:sticky; left:0; z-index:3; background:var(--surface); box-shadow:1px 0 0 var(--line);}
  thead .stickyleftcol{z-index:4;}
  .feegroupend{border-right:2px solid var(--ink) !important;}
  .scrollbox tr.subtotal td, .scrollbox tr.grand td{position:sticky; bottom:0; background:var(--surface); z-index:1; box-shadow:0 -1px 0 var(--ink);}
  .mdmtable{border-collapse:collapse; font-size:12.8px;}
  .mdmtable thead th{background:var(--accent-dark); color:#fff; padding:8px 10px; border-bottom:2px solid var(--accent); white-space:nowrap; position:sticky; top:0; z-index:2; box-shadow:0 1px 0 var(--line);}
  .mdmtable tbody td{padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  .mdmtable tbody tr:nth-of-type(even) td{background:#FBFAF6;}
  .mastertable thead th{
    text-align:left; font-size:12.5px; text-transform:none; letter-spacing:0;
    color:#fff; border-bottom:2px solid var(--accent); background:var(--accent-dark);
    padding:8px 10px; font-weight:700; white-space:nowrap;
  }
  .mastertable tbody td{padding:4px 10px; white-space:nowrap;}
  .mastertable tbody tr:nth-of-type(even) td{background:#FBFAF6;}
  .mastertable tbody td input[type=text],
  .mastertable tbody td input[type=number],
  .mastertable tbody td select{padding:5px 7px; font-size:13px;}
  .mastertable tbody td .readonlycell{display:inline-block; padding:5px 7px; font-size:13px; color:var(--ink);}
  .mastertable td.actionscell{white-space:nowrap; overflow:visible;}
  .btn-sm{
    font-family:'Times New Roman', Times, serif; font-size:12px; padding:4px 11px; border-radius:5px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; font-weight:700; transition:all 0.12s ease; white-space:nowrap;
  }
  .btn-sm:hover{border-color:var(--accent); color:var(--accent);}
  .btn-sm.danger{color:var(--neg); border-color:#E3B8B8;}
  .btn-sm.danger:hover{background:var(--neg-soft);}
  .btn-sm.primary{background:var(--accent); color:#fff; border-color:var(--accent-dark);}
  .btn-sm.primary:hover{color:#fff; background:#2A3D75;}
  .actionsrow{display:inline-flex; gap:6px; white-space:nowrap;}

  /* Output ledger tables */
  .ledger{width:100%; border-collapse:separate; border-spacing:0; font-family:'Times New Roman', Times, serif; font-size:13px;}
  .ledger.compact{width:auto; table-layout:fixed;}
  .ledger th{
    text-align:right; padding:8px 11px; border-bottom:2px solid var(--accent);
    font-family:'Times New Roman', Times, serif; font-weight:700; white-space:nowrap; color:#fff;
    text-transform:uppercase; font-size:10.5px; letter-spacing:0.06em; background:var(--accent-dark);
  }
  .ledger th:first-child{text-align:left;}
  .ledger td{padding:6px 11px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .ledger tbody tr:not(.section):not(.subtotal):not(.grand):nth-of-type(even) td{background:#FBFAF6;}
  .ledger td input[type=number], .ledger td input.gmvcell, .ledger td input.misccell, .ledger td input.invmovecell, .ledger td input.credopbalcell, .ledger td input.credpmtovcell{
    width:90px; border:1px solid var(--line) !important; border-radius:5px; padding:5px 7px;
    background:#fff; color:var(--ink); font-size:13px;
  }
  .ledger td input[type=number]:focus, .ledger td input.gmvcell:focus, .ledger td input.misccell:focus, .ledger td input.invmovecell:focus, .ledger td input.credopbalcell:focus, .ledger td input.credpmtovcell:focus{
    outline:none; border-color:var(--accent) !important; box-shadow:0 0 0 2px var(--accent-soft);
  }
  .ledger td input.gmvcell, .ledger td input.misccell, .ledger td input.invmovecell, .ledger td input.credopbalcell, .ledger td input.credpmtovcell{text-align:right; font-variant-numeric:tabular-nums; font-family:'Times New Roman', Times, serif;}
  .ledger td:first-child{text-align:left; white-space:normal; font-variant-numeric:normal;}
  .ledger tr.section td{background:var(--accent-soft);}
  .ledger tr.section2 td{background:var(--accent-dark); color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; font-size:12px; padding-top:8px; padding-bottom:8px;}
  .ledger tr.section td:first-child{font-weight:700; color:var(--accent-dark); padding-top:10px; padding-bottom:10px; font-size:14px;}
  .ledger tr.subtotal td{font-weight:700; border-top:1px solid var(--accent-dark); border-bottom:1px double var(--accent-dark); background:#EBEEF6; color:var(--accent-dark);}
  .ledger tr.grand td{font-weight:700; border-top:2px solid var(--accent); color:#fff; font-size:14.5px; background:var(--accent-dark);}
  .ledger tr.lineitem td:first-child{color:var(--ink-soft); padding-left:22px;}
  .ledger tr.neg td{color:var(--neg);}
  .ledger td.total-col{border-left:2px solid var(--accent); font-weight:700; background:#FCF6EB;}
  .ledger tr.grand td.total-col{background:var(--accent-dark); border-left:2px solid var(--accent);}
  .ledger tr.subtotal td.total-col{background:#EBEEF6; border-left:2px solid var(--accent);}

  .tag{font-size:10.5px; padding:2px 9px; border-radius:99px; font-weight:700; letter-spacing:0.03em;}
  .tag.CODB{background:var(--accent-soft); color:var(--accent);}
  .tag.CIDB{background:var(--neg-soft); color:var(--neg);}
  .tag.MISC{background:var(--gold-soft); color:var(--gold);}

  .footnote{font-size:12px; color:var(--ink-soft); margin-top:12px; line-height:1.6; font-style:italic;}
  .hidden{display:none !important;}

  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; padding:16px 0; position:static; height:auto; overflow-y:visible;}
    .main{padding:20px;}
    .kpirow{flex-direction:column;}
  }
</style>

<script>
/* ---------------------------------------------------------------
   STATE — loaded from data.json (sibling file). Falls back to a
   minimal seed if the fetch fails (e.g. opened via file:// where
   local fetch is blocked by the browser). On GitHub Pages / any
   http server, data.json will load normally.
   ----------------------------------------------------------------*/
let DATA = null;
const DEFAULT_MONTHS = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
const MONTHS_CALENDAR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let MONTHS = DEFAULT_MONTHS.slice();
const BRAND_GROUP_OPTIONS = ["Focus","Rainbow"];
const MODEL_OPTIONS = ["B2C","B2B"];
const DEFAULT_PARTNER_GROUPS = ["Website","FAM","MAN","Stores","Other MP","Other Offline","QCK"];
const CODB_RATE_BASIS_OPTIONS = ["% NSV","Rs Per Gross Qty","Rs Per COD Qty","Rs Per Returns Qty","Amt per mth"];

// FY27 is the earliest year this tool ever offers (older years are gone).
// The list is computed fresh every time it's needed (not a fixed array) so
// that once a fiscal year's March has passed, it stops appearing as an
// option for NEW cycles — existing cycles already created in that FY are
// untouched, this only affects what you can pick when creating a new one.
function getAvailableFYOptions(){
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth(); // 0 = Jan
  const currentFYEndYear = (m >= 3) ? y+1 : y; // FY ends Mar of this year
  const currentFYNum = currentFYEndYear % 100;
  const startFY = 27;
  const endFY = Math.max(currentFYNum + 5, startFY); // keep a few years of runway ahead
  const options = [];
  for(let yy = startFY; yy <= endFY; yy++){
    const fyEndYear = 2000 + yy;
    const fyEndDate = new Date(fyEndYear, 2, 31); // Mar 31 of that FY's ending year
    if(fyEndDate >= today) options.push('FY'+yy);
  }
  return options;
}

function computeCycleMonths(cycle){
  if(cycle.rollingMonths){
    // Backward compatibility for cycles created before this redesign.
    const startIdx = MONTHS_CALENDAR.indexOf(cycle.startMonth);
    const n = parseInt(cycle.rollingMonths,10) || 12;
    if(startIdx === -1) return DEFAULT_MONTHS.slice();
    const out = [];
    for(let i=0; i<n; i++){ out.push(MONTHS_CALENDAR[(startIdx+i) % 12]); }
    return out;
  }
  // Always ends at Mar of the cycle's FY — start month can be anywhere
  // within that FY's Apr-Mar window (e.g. a company starting its AOP in Oct).
  const idx = DEFAULT_MONTHS.indexOf(cycle.startMonth);
  return idx === -1 ? DEFAULT_MONTHS.slice() : DEFAULT_MONTHS.slice(idx);
}
function cycleLabel(cycle){
  if(!cycle) return '';
  const brand = DATA.brands.find(b=>b.id===cycle.brandId);
  const months = computeCycleMonths(cycle);
  const endMonth = months[months.length-1];
  const fy = cycle.fy || '';
  const version = cycle.version || 'AOP';
  const isPublished = cycle.published !== false;
  const dot = isPublished ? '🟢' : '⚪';
  const draftTag = isPublished ? '' : ' (Draft)';
  return `${dot} ${brand?brand.name:'—'} · ${fy} · ${version} · ${cycle.startMonth}-${endMonth}${draftTag}`;
}
function getActiveCycle(){
  return (DATA.aopCycles||[]).find(c=>c.id===DATA.meta.activeCycleId) || null;
}
function applyActiveCycle(){
  const c = getActiveCycle();
  MONTHS = c ? computeCycleMonths(c) : DEFAULT_MONTHS.slice();
}
// Cycle-scoped input data: salesInputByCycle / codbRateCardByCycle /
// miscInputsByCycle are each an object keyed by cycle id ('' = the default
// Apr-Mar cycle with no AOP cycle selected).
// getCycleData returns the array for whichever cycle is currently active,
// auto-creating an empty one the first time a given cycle is touched.
function getCycleData(byCycleKey){
  const ck = DATA.meta.activeCycleId || '';
  if(!DATA[byCycleKey]) DATA[byCycleKey] = {};
  if(!DATA[byCycleKey][ck]) DATA[byCycleKey][ck] = [];
  return DATA[byCycleKey][ck];
}
// Same idea as getCycleData, but for cycle-scoped values that are naturally
// keyed objects (e.g. {month: value}) rather than row arrays.
function getCycleObj(byCycleKey){
  const ck = DATA.meta.activeCycleId || '';
  if(!DATA[byCycleKey]) DATA[byCycleKey] = {};
  if(!DATA[byCycleKey][ck]) DATA[byCycleKey][ck] = {};
  return DATA[byCycleKey][ck];
}

const SEED = {
  meta:{fyLabel:"FY 2026-27", months:DEFAULT_MONTHS, savedAt:null, activeCycleId:''},
  aopCycles:[],
  channels:[{id:"CH1",name:"General Trade"},{id:"CH2",name:"Modern Trade"},{id:"CH3",name:"E-commerce"}],
  brands:[{id:"BR1",name:"Brand A",brandGroup:"Focus"}],
  partnerGroups: DEFAULT_PARTNER_GROUPS.map(n=>({id:n, name:n, description:""})),
  partnerModels:[{id:"PM1",partner:"Website",model:"B2C",partnerGroup:"Website"}],
  brandPartnerMapping:[{id:"BPM1",brandId:"BR1",partner:"Website",model:"B2C",creditDays:30}],
  expenseLineItems:[
    {id:"EL1",name:"Trade Scheme",category:"Other Expenses",gstRate:18,creditorDays:30,type:"CODB"},
    {id:"EL2",name:"Logistics / Freight",category:"Other Expenses",gstRate:18,creditorDays:30,type:"CODB"},
    {id:"EL6",name:"Brand Marketing",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"},
    {id:"EL7",name:"Salaries",category:"Other Expenses",gstRate:0,creditorDays:0,type:"MISC"},
    {id:"EL8",name:"Overheads",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"},
    {id:"EL9",name:"Rent",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"}
  ],
  codbLineItems:[], marketplaceDeductionMapping:[],
  productGroups:[{id:"PG1",name:"Personal Care"}],
  productCategories:[{id:"PC1",name:"Towels",productGroupId:"PG1"}],
  productSubCategories:[{id:"PSC1",name:"Bath Towel",productGroupId:"PG1",productCategoryId:"PC1",amrp:100,acogs:40}],
  salesInputByCycle:{'':[]}, codbRateCardByCycle:{'':{}}, miscInputsByCycle:{'':{}}, discMarginGstByCycle:{'':{}}, paretoInputByCycle:{'':{}},
  debtorsByCycle:{'':{}}, debtorsOverrideByCycle:{'':{}}, creditorsByCycle:{'':[]}, inventoryByCycle:{'':{}}, creditorPmtOverrideByCycle:{'':{}}
};

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,8); }

async function loadData(){
  let fromFile = null;
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(res.ok) fromFile = await res.json();
  }catch(e){ /* ignore — file may not be reachable (e.g. file:// or first deploy) */ }

  // data.json (saved via the Save button to GitHub/Vercel) is the single
  // source of truth, so every user always sees the same data. No local
  // browser copy is compared or preferred anymore.
  DATA = fromFile || JSON.parse(JSON.stringify(SEED));
  // Migration: backfill any fields/arrays introduced after this data.json was last saved,
  // so older saved files keep working without losing existing rows.
  ['codbLineItems','marketplaceDeductionMapping','productGroups','productCategories'].forEach(k=>{ if(!DATA[k]) DATA[k]=[]; });
  // Migrate salesInput from the old flat-array shape into the new cycle-scoped
  // shape ({'': [...], [cycleId]: [...]}) so that pre-existing data lands in
  // the default (no-cycle) bucket rather than being lost.
  ['salesInputByCycle'].forEach(k=>{
    if(!DATA[k]){
      const oldKey = k.replace('ByCycle','');
      DATA[k] = { '': Array.isArray(DATA[oldKey]) ? DATA[oldKey] : [] };
    }
    if(!DATA[k]['']) DATA[k][''] = [];
  });
  if(!DATA.codbRateCardByCycle) DATA.codbRateCardByCycle = {'':{}};
  if(!DATA.codbRateCardByCycle['']) DATA.codbRateCardByCycle[''] = {};
  // miscInputsByCycle: migrate from the old array-of-rows shape ({lineItemId, month,
  // amount} rows) into the new auto-populated {lineItemId: {month: amount}} shape,
  // converting existing entries rather than losing them.
  if(!DATA.miscInputsByCycle){
    const oldRows = Array.isArray(DATA.miscInputs) ? DATA.miscInputs : [];
    DATA.miscInputsByCycle = { '': {} };
    oldRows.forEach(r=>{
      if(!r.lineItemId || !r.month) return;
      if(!DATA.miscInputsByCycle[''][r.lineItemId]) DATA.miscInputsByCycle[''][r.lineItemId] = {};
      DATA.miscInputsByCycle[''][r.lineItemId][r.month] = r.amount;
    });
  }
  Object.keys(DATA.miscInputsByCycle).forEach(cycleKey=>{
    const val = DATA.miscInputsByCycle[cycleKey];
    if(Array.isArray(val)){
      const obj = {};
      val.forEach(r=>{
        if(!r.lineItemId || !r.month) return;
        if(!obj[r.lineItemId]) obj[r.lineItemId] = {};
        obj[r.lineItemId][r.month] = r.amount;
      });
      DATA.miscInputsByCycle[cycleKey] = obj;
    }
  });
  if(!DATA.miscInputsByCycle['']) DATA.miscInputsByCycle[''] = {};
  if(!DATA.productSubCategories){
    // Migrate any pre-existing SKU Master rows into the new Product Sub Category master
    // so nothing is lost when upgrading from the old SKU-based structure.
    DATA.productSubCategories = (DATA.skuMaster || []).map(s=>({
      id: s.id, name: s.name, productGroupId: '', productCategoryId: '',
      amrp: s.amrp, acogs: s.acogs
    }));
  }
  // AMRP/ACOGS/GST% moved from the Product Sub Category master into a dedicated
  // cycle-scoped Pareto Input tab. Migrate any values already on the master rows
  // into both the default ('') cycle and the currently active cycle, so nothing
  // that was already entered goes missing, then strip the fields off the master.
  if(!DATA.paretoInputByCycle) DATA.paretoInputByCycle = {'':{}};
  if(!DATA.debtorsByCycle) DATA.debtorsByCycle = {'':{}};
  if(!DATA.debtorsOverrideByCycle) DATA.debtorsOverrideByCycle = {'':{}};
  if(!DATA.creditorsByCycle) DATA.creditorsByCycle = {'':[]};
  if(!DATA.creditorPmtOverrideByCycle) DATA.creditorPmtOverrideByCycle = {'':{}};
  if(!DATA.inventoryByCycle) DATA.inventoryByCycle = {'':{}};
  if(!DATA.paretoInputByCycle['']) DATA.paretoInputByCycle[''] = {};
  {
    const pscMigrateTargets = [''];
    if(DATA.meta && DATA.meta.activeCycleId && !pscMigrateTargets.includes(DATA.meta.activeCycleId)){
      pscMigrateTargets.push(DATA.meta.activeCycleId);
    }
    (DATA.productSubCategories||[]).forEach(sc=>{
      const hasOldFields = sc.amrp!==undefined || sc.acogs!==undefined || sc.gstPct!==undefined;
      if(hasOldFields){
        pscMigrateTargets.forEach(cid=>{
          if(!DATA.paretoInputByCycle[cid]) DATA.paretoInputByCycle[cid] = {};
          if(!DATA.paretoInputByCycle[cid][sc.id]){
            DATA.paretoInputByCycle[cid][sc.id] = {amrp: sc.amrp, acogs: sc.acogs, gstPct: sc.gstPct};
          }
        });
        delete sc.amrp; delete sc.acogs; delete sc.gstPct;
      }
    });
  }
  if(!DATA.partnerGroups) DATA.partnerGroups = DEFAULT_PARTNER_GROUPS.map(n=>({id:n, name:n, description:""}));
  (DATA.partnerModels||[]).forEach(p=>{
    if(p.partnerGroup && !DATA.partnerGroups.some(g=>g.id===p.partnerGroup)){
      DATA.partnerGroups.push({id:p.partnerGroup, name:p.partnerGroup, description:""});
    }
  });
  (DATA.brands||[]).forEach(b=>{
    if(b.brandGroup===undefined) b.brandGroup = '';
  });
  (DATA.partnerModels||[]).forEach(p=>{
    if(p.partner===undefined) p.partner = p.name || '';
    if(p.model===undefined || !MODEL_OPTIONS.includes(p.model)) p.model = p.model || '';
    if(p.partnerGroup===undefined) p.partnerGroup = '';
  });
  (DATA.brandPartnerMapping||[]).forEach(m=>{
    if(m.partner===undefined) m.partner = '';
    if(m.model===undefined) m.model = '';
    if(m.creditDays===undefined) m.creditDays = '';
  });
  (DATA.expenseLineItems||[]).forEach(x=>{
    if(x.category===undefined) x.category = 'Other Expenses';
    if(x.gstRate===undefined) x.gstRate = '';
    if(x.creditorDays===undefined) x.creditorDays = '';
  });
  if(!DATA.aopCycles) DATA.aopCycles = [];
  DATA.aopCycles.forEach(c=>{ if(c.published===undefined) c.published = true; });
  if(DATA.meta.activeCycleId===undefined) DATA.meta.activeCycleId = '';
  applyActiveCycle();
  const fyLabelEl = document.getElementById('fyLabel');
  if(fyLabelEl) fyLabelEl.textContent = DATA.meta?.fyLabel || 'Annual Budget';
  render();
}

/* ---------------------------------------------------------------
   GENERIC TABLE EDITOR
   ----------------------------------------------------------------*/
function fieldInput(row, col){
  const val = row[col.key] ?? '';
  if(col.readOnly){
    return `<span class="readonlycell" data-key="${col.key}">${val}</span>`;
  }
  if(col.type === 'select'){
    const opts = col.options();
    if(opts.length && !opts.some(o=>o.id===val)){
      // No blank placeholder — a select always shows a real option. If the
      // stored value doesn't match one (unset, or an old/removed value),
      // default to the first option and keep the row's data in sync with
      // what's actually displayed.
      row[col.key] = opts[0].id;
    }
    const effectiveVal = row[col.key] ?? val;
    let html = `<select data-key="${col.key}">`;
    opts.forEach(o=>{
      html += `<option value="${o.id}" ${o.id===effectiveVal?'selected':''}>${o.label}</option>`;
    });
    html += `</select>`;
    return html;
  }
  if(col.type === 'number'){
    const display = (col.decimals!==undefined && val!=='' && val!==null && val!==undefined)
      ? Number(val).toFixed(col.decimals)
      : val;
    return `<input type="number" step="any" data-key="${col.key}" value="${display}">`;
  }
  return `<input type="text" data-key="${col.key}" value="${val}">`;
}

function renderEditableTable(container, arr, cols, opts){
  opts = opts || {};
  let html = '';
  if(arr.length){
    html += `<button class="btn-sm danger" id="deleteAllRowsBtn" style="margin-bottom:10px;">🗑 Delete all rows</button>`;
  }
  html += `<table><thead><tr>`;
  cols.forEach(c=> html += `<th>${c.label}</th>`);
  html += `<th style="width:30px;"></th></tr></thead><tbody>`;
  arr.forEach((row,idx)=>{
    html += `<tr data-idx="${idx}">`;
    cols.forEach(c=> html += `<td>${fieldInput(row,c)}</td>`);
    html += `<td><button class="rowdel" data-del="${idx}" title="Delete row">✕</button></td></tr>`;
  });
  html += `</tbody></table><button class="addrow" id="addRowBtn">+ Add row</button>`;
  container.innerHTML = html;

  container.querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('change', e=>{
      const tr = e.target.closest('tr');
      const idx = +tr.dataset.idx;
      const key = e.target.dataset.key;
      let v = e.target.value;
      if(e.target.type === 'number') v = v === '' ? '' : parseFloat(v);
      arr[idx][key] = v;
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });
  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      arr.splice(+btn.dataset.del,1);
      renderEditableTable(container, arr, cols, opts);
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });
  const deleteAllBtn = container.querySelector('#deleteAllRowsBtn');
  if(deleteAllBtn) deleteAllBtn.addEventListener('click', ()=>{
    if(!confirm(`Delete all ${arr.length} row(s)? This cannot be undone.`)) return;
    arr.length = 0;
    renderEditableTable(container, arr, cols, opts);
    if(opts.onChange) opts.onChange();
    markDirty();
  });
  container.querySelector('#addRowBtn').addEventListener('click', ()=>{
    const blank = {id: uid(opts.prefix||'ROW')};
    cols.forEach(c=> blank[c.key] = c.default !== undefined ? c.default : '');
    arr.push(blank);
    renderEditableTable(container, arr, cols, opts);
    markDirty();
  });
}

let autosaveTimer = null;
function markDirty(){
  if(autosaveTimer) clearTimeout(autosaveTimer);
  markUnsavedStatus();
  autosaveTimer = setTimeout(saveToGitHub, 2500);
}
function markUnsavedStatus(){
  const el = document.getElementById('sidebarSaveStatus');
  if(el) el.textContent = 'Unsaved changes — saving shortly…';
}
async function saveToGitHub(){
  const el = document.getElementById('sidebarSaveStatus');
  const btn = document.getElementById('sidebarSaveBtn');
  if(el) el.textContent = 'Saving to GitHub…';
  if(btn) btn.disabled = true;
  try{
    DATA.meta = DATA.meta || {};
    DATA.meta.savedAt = new Date().toISOString();
    const resp = await fetch('/api/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(DATA)
    });
    const result = await resp.json();
    if(!resp.ok) throw new Error(result.error || 'Save failed');
    if(el) el.textContent = 'Saved to GitHub ' + new Date().toLocaleTimeString();
  }catch(e){
    if(el) el.textContent = 'Could not save to GitHub (' + e.message + ') — try again';
  }finally{
    if(btn) btn.disabled = false;
  }
}

/* ---------------------------------------------------------------
   MASTER TABLE — richer editor used for the Masters & Config screens:
   paste-from-Excel bulk import, inline add-row form, checkbox
   multi-select with "Delete selected", per-row Edit/Remove buttons.
   ----------------------------------------------------------------*/
function resolveValueForCol(col, text){
  text = (text||'').trim();
  if(col.type === 'select'){
    const opts = col.options();
    const hit = opts.find(o=> normalizeText(o.label) === normalizeText(text));
    return hit ? hit.id : '';
  }
  if(col.type === 'number'){
    // Strip thousands-separator commas (and stray currency symbols/spaces) before parsing —
    // otherwise parseFloat("1,500") silently returns 1, dropping everything after the comma.
    const cleaned = text.replace(/[,₹$\s]/g, '');
    const n = parseFloat(cleaned);
    return isNaN(n) ? '' : n;
  }
  return text;
}

function rowMatches(a, b, cols){
  return cols.every(c=>{
    const av = a[c.key], bv = b[c.key];
    if(typeof av === 'number' || typeof bv === 'number'){
      return (parseFloat(av)||0) === (parseFloat(bv)||0);
    }
    return String(av ?? '').trim().toLowerCase() === String(bv ?? '').trim().toLowerCase();
  });
}
function isDuplicateRow(candidate, arr, cols){
  return arr.some(r=> rowMatches(r, candidate, cols));
}

function renderMasterTable(container, arr, cols, opts){
  opts = opts || {};
  const pasteHint = cols.map(c=>c.label).join(' | ');

  let html = '';
  if(opts.paste !== false){
    html += pasteBoxHtml(pasteHint);
  }

  if(opts.allowAdd !== false){
    html += `<div class="addform">`;
    cols.forEach(c=>{
      const w = c.width || 130;
      html += `<div class="addfield" style="width:${w}px;"><label>${c.label}</label>${fieldInput({}, c).replace('data-key','data-addkey')}</div>`;
    });
    html += `<button class="btn primary addbtn" id="addRowBtn2">${opts.addLabel || 'Add'}</button>`;
    html += `</div>`;
  }

  html += `<button class="btn danger" id="deleteSelBtn">Delete selected</button>`;

  // Frozen header + independent scroll is the default for every master table
  // once it grows long, rather than something each screen has to opt into.
  const maxH = opts.tableMaxHeight === false ? null : (opts.tableMaxHeight || '65vh');
  const scrollOpen = maxH ? `<div class="scrollbox" style="max-height:${maxH};">` : '';
  const scrollClose = maxH ? `</div>` : '';
  html += scrollOpen;
  html += `<table class="mastertable"><colgroup><col style="width:34px;">`;
  cols.forEach(c=> html += `<col${c.width?` style="width:${c.width}px;"`:''}>`);
  html += `<col style="width:150px;"></colgroup>`;
  html += `<thead><tr><th><input type="checkbox" id="selAll"></th>`;
  cols.forEach(c=> html += `<th>${c.label}</th>`);
  html += `<th></th></tr></thead><tbody>`;
  arr.forEach((row,idx)=>{
    html += `<tr data-idx="${idx}"><td><input type="checkbox" class="rowsel" data-selidx="${idx}"></td>`;
    cols.forEach(c=> html += `<td>${fieldInput(row,c)}</td>`);
    html += `<td class="actionscell"><div class="actionsrow"><button class="btn-sm" data-editidx="${idx}">Edit</button><button class="btn-sm danger" data-del="${idx}">Remove</button></div></td></tr>`;
  });
  html += `</tbody></table>`;
  html += scrollClose;

  container.innerHTML = html;

  function rerender(){ renderMasterTable(container, arr, cols, opts); if(opts.onChange) opts.onChange(); markDirty(); }

  container.querySelectorAll('tbody input[data-key],tbody select[data-key]').forEach(el=>{
    el.addEventListener('change', e=>{
      const tr = e.target.closest('tr');
      const idx = +tr.dataset.idx;
      const key = e.target.dataset.key;
      let v = e.target.value;
      if(e.target.type === 'number') v = v === '' ? '' : parseFloat(v);
      arr[idx][key] = v;
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });

  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{ arr.splice(+btn.dataset.del,1); rerender(); });
  });

  container.querySelectorAll('[data-editidx]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const tr = btn.closest('tr');
      const firstField = tr.querySelector('input,select');
      if(firstField) firstField.focus();
    });
  });

  const selAll = container.querySelector('#selAll');
  if(selAll) selAll.addEventListener('change', ()=>{
    container.querySelectorAll('.rowsel').forEach(cb=> cb.checked = selAll.checked);
  });

  const delSelBtn = container.querySelector('#deleteSelBtn');
  if(delSelBtn) delSelBtn.addEventListener('click', ()=>{
    const idxs = Array.from(container.querySelectorAll('.rowsel:checked')).map(cb=>+cb.dataset.selidx);
    if(!idxs.length) return;
    idxs.sort((a,b)=>b-a).forEach(i=> arr.splice(i,1));
    rerender();
  });

  const addBtn = container.querySelector('#addRowBtn2');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const row = {id: uid(opts.prefix||'ROW')};
    container.querySelectorAll('[data-addkey]').forEach(el=>{
      let v = el.value;
      if(el.type === 'number') v = v === '' ? '' : parseFloat(v);
      row[el.dataset.addkey] = v;
    });
    if(opts.buildRow) Object.assign(row, opts.buildRow(row) || {});
    if(isDuplicateRow(row, arr, cols)){
      alert('That row already exists — not adding a duplicate.');
      return;
    }
    arr.push(row);
    rerender();
  });

  const importBtn = container.querySelector('#importBtn');
  if(importBtn) importBtn.addEventListener('click', ()=>{
    const text = container.querySelector('#pasteArea').value;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    const keyCol = cols[0].key;
    let added = 0, updated = 0;
    lines.forEach(line=>{
      const parts = line.split('\t');
      const row = {};
      cols.forEach((c,i)=>{ row[c.key] = resolveValueForCol(c, parts[i]); });
      const keyVal = row[keyCol];
      const existing = (keyVal!=='' && keyVal!=null)
        ? arr.find(r=> normalizeText(r[keyCol]) === normalizeText(keyVal))
        : null;
      if(existing){
        // Same key (e.g. same name) already in the table — update its other
        // fields with the newly pasted values instead of adding a duplicate row.
        // A blank pasted cell leaves the existing value alone rather than wiping it.
        cols.forEach(c=>{
          if(row[c.key] !== '' && row[c.key] != null) existing[c.key] = row[c.key];
        });
        updated++;
        return;
      }
      row.id = uid(opts.prefix||'ROW');
      if(opts.buildRow) Object.assign(row, opts.buildRow(row) || {});
      arr.push(row);
      added++;
    });
    rerender();
    if(updated > 0){
      alert(`Imported ${added} new row(s), updated ${updated} existing row(s) with the new values.`);
    }
  });

  const clearBtn = container.querySelector('#clearPasteBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    container.querySelector('#pasteArea').value = '';
  });
}

function renderRateStructureAndChannelTable(container){
  const items = DATA.codbLineItems;
  const pms = DATA.partnerModels;
  if(!items.length){
    container.innerHTML = `<div class="footnote">No CODB Line Items defined yet — add some in the "CODB Line Items" tab first.</div>`;
    return;
  }

  let html = `<div class="footnote" style="margin-bottom:14px;">Rate Basis and which Partner-Models each CODB Line Item applies to — add new items in the "CODB Line Items" tab; this only maps what's already there. Leave a row's Partner-Model boxes fully unticked to show it for every Partner-Model (unfiltered) in the CODB Rate Card. Tick "All Channel" to take the input just once and apply it to every channel, instead of entering it per Partner-Model. Note: CAC does not appear in the CODB Rate Card — it has its own "CAC %" input tab (% of GMV, not NSV).</div>`;
  html += `<div class="panel" style="max-width:100%;"><div class="scrollbox" style="max-height:65vh; overflow-x:auto;"><table class="mdmtable"><thead><tr><th>CODB Line Item</th><th>Rate Basis</th><th style="text-align:center;">All Channel</th>`;
  pms.forEach(pm=> html += `<th style="text-align:center;">${pmLabel(pm)}</th>`);
  html += `<th></th></tr></thead><tbody>`;
  items.forEach(li=>{
    if(!li.mappedPartnerModels) li.mappedPartnerModels = [];
    html += `<tr><td>${li.name}</td>`;
    html += `<td>${fieldInput(li, {key:'rateBasis', type:'select', options:()=>CODB_RATE_BASIS_OPTIONS.map(v=>({id:v,label:v}))}).replace('<select', `<select data-li="${li.id}"`)}</td>`;
    html += `<td style="text-align:center;"><input type="checkbox" class="codballchannel" data-li="${li.id}" ${li.allChannel?'checked':''}></td>`;
    pms.forEach(pm=>{
      const checked = li.mappedPartnerModels.includes(pm.id);
      html += `<td style="text-align:center;"><input type="checkbox" class="codbchanmap" data-li="${li.id}" data-pm="${pm.id}" ${checked?'checked':''} ${li.allChannel?'disabled':''}></td>`;
    });
    html += `<td><button class="btn-sm danger" data-removeli="${li.id}">Remove</button></td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  container.innerHTML = html;

  container.querySelectorAll('[data-key="rateBasis"]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      const li = items.find(x=>x.id===sel.dataset.li);
      if(li) li[sel.dataset.key] = sel.value;
      markDirty();
    });
  });

  container.querySelectorAll('.codballchannel').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const li = items.find(x=>x.id===cb.dataset.li);
      if(li) li.allChannel = cb.checked;
      markDirty();
      renderRateStructureAndChannelTable(container);
    });
  });

  container.querySelectorAll('.codbchanmap').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const li = items.find(x=>x.id===cb.dataset.li);
      if(!li.mappedPartnerModels) li.mappedPartnerModels = [];
      if(cb.checked){
        if(!li.mappedPartnerModels.includes(cb.dataset.pm)) li.mappedPartnerModels.push(cb.dataset.pm);
      } else {
        li.mappedPartnerModels = li.mappedPartnerModels.filter(id=> id!==cb.dataset.pm);
      }
      markDirty();
    });
  });

  container.querySelectorAll('[data-removeli]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = items.findIndex(x=>x.id===btn.dataset.removeli);
      if(idx===-1) return;
      if(!confirm(`Remove "${items[idx].name}"? This removes it everywhere, including the CODB Line Items tab.`)) return;
      items.splice(idx,1);
      markDirty();
      renderRateStructureAndChannelTable(container);
    });
  });
}

function renderMarketplaceDeductionMapping(container){
  const filterBrandId = container.dataset.filterBrand || '';
  const filterItemId = container.dataset.filterItem || '';

  // Only brands with at least one Brand -> Partner-Model mapping are eligible here —
  // a brand with no mapping has nothing to deduct against, so it's excluded entirely.
  const mappedBrandIds = new Set(DATA.brandPartnerMapping.map(m=>m.brandId));
  const brandOptions = DATA.brands.filter(b=> mappedBrandIds.has(b.id));
  const itemOptions = DATA.codbLineItems;

  const rowBrands = filterBrandId ? brandOptions.filter(b=>b.id===filterBrandId) : brandOptions;
  const rowItems = filterItemId ? itemOptions.filter(x=>x.id===filterItemId) : itemOptions;

  const getBrandCols = (brandId)=>{
    const cols = [];
    DATA.brandPartnerMapping.filter(m=>m.brandId===brandId).forEach(m=>{
      const pm = DATA.partnerModels.find(p=>p.partner===m.partner && p.model===m.model);
      if(pm && !cols.some(c=>c.id===pm.id)) cols.push(pm);
    });
    return cols;
  };

  const isChecked = (brandId, pmId, itemId)=> DATA.marketplaceDeductionMapping.some(m=> m.brandId===brandId && m.partnerModelId===pmId && m.codbLineItemId===itemId);

  let html = `<h2 style="margin-top:0;">Marketplace Deduction Mapping</h2>
  <div class="desc">For each Brand → Partner-Model, tick which CODB line items are <strong>deducted by the marketplace</strong> (reduces Collectable — not a separate cash payment). Only brands with a Brand → Partner-Model mapping (tab 4) appear here, and each brand only shows the Partner-Models it's actually mapped to.</div>
  <div class="addform" style="margin-bottom:14px;">
    <div class="addfield"><label>Brand</label>
      <select id="mdmBrandFilter"><option value="">All Brands</option>${brandOptions.map(b=>`<option value="${b.id}" ${b.id===filterBrandId?'selected':''}>${b.name}</option>`).join('')}</select>
    </div>
    <div class="addfield"><label>CODB Item</label>
      <select id="mdmItemFilter"><option value="">All Items</option>${itemOptions.map(x=>`<option value="${x.id}" ${x.id===filterItemId?'selected':''}>${x.name}</option>`).join('')}</select>
    </div>
    <button class="btn primary" id="mdmSaveBtn">Save mapping</button>
  </div>`;

  if(!DATA.partnerModels.length){
    html += `<div class="footnote">No Partner-Model combos yet — add some in "3. Partner-Model master" first.</div>`;
  } else if(!rowBrands.length || !rowItems.length){
    html += `<div class="footnote">No Brands (with a Brand → Partner-Model mapping) or CODB Line Items to show yet.</div>`;
  } else {
    rowBrands.forEach(b=>{
      const brandCols = getBrandCols(b.id);
      html += `<h3 style="margin:18px 0 8px 0;">${b.name}</h3>`;
      if(!brandCols.length){
        html += `<div class="footnote" style="margin-bottom:16px;">No Partner-Model mapping for ${b.name} yet — add one in "4. Brand → Partner Mapping".</div>`;
        return;
      }
      html += `<div class="scrollbox mdm-scrollbox" style="max-height:420px; overflow-x:auto; margin-bottom:22px;"><table class="mdmtable"><thead><tr><th>CODB / Expense Item</th><th style="text-align:center;">Sel All</th>`;
      brandCols.forEach(c=> html += `<th style="text-align:center;">${c.partner}<br><span style="font-weight:400;">${c.model}</span></th>`);
      html += `</tr></thead><tbody>`;
      rowItems.forEach(item=>{
        html += `<tr><td>${item.name}</td>`;
        html += `<td style="text-align:center;"><input type="checkbox" class="mdmRowSel" data-brand="${b.id}" data-item="${item.id}"></td>`;
        brandCols.forEach(c=>{
          const checked = isChecked(b.id, c.id, item.id);
          html += `<td style="text-align:center;"><input type="checkbox" class="mdmCell" data-brand="${b.id}" data-pm="${c.id}" data-item="${item.id}" ${checked?'checked':''}></td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
    });
  }

  container.innerHTML = html;

  container.querySelector('#mdmBrandFilter').addEventListener('change', e=>{
    container.dataset.filterBrand = e.target.value;
    renderMarketplaceDeductionMapping(container);
  });
  container.querySelector('#mdmItemFilter').addEventListener('change', e=>{
    container.dataset.filterItem = e.target.value;
    renderMarketplaceDeductionMapping(container);
  });

  container.querySelectorAll('.mdmCell').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const brandId = cb.dataset.brand, pmId = cb.dataset.pm, itemId = cb.dataset.item;
      const existingIdx = DATA.marketplaceDeductionMapping.findIndex(m=> m.brandId===brandId && m.partnerModelId===pmId && m.codbLineItemId===itemId);
      if(cb.checked && existingIdx===-1) DATA.marketplaceDeductionMapping.push({brandId, partnerModelId:pmId, codbLineItemId:itemId});
      if(!cb.checked && existingIdx>-1) DATA.marketplaceDeductionMapping.splice(existingIdx,1);
      markDirty();
    });
  });

  container.querySelectorAll('.mdmRowSel').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const brandId = cb.dataset.brand, itemId = cb.dataset.item;
      container.querySelectorAll(`.mdmCell[data-brand="${brandId}"][data-item="${itemId}"]`).forEach(cell=>{
        cell.checked = cb.checked;
        cell.dispatchEvent(new Event('change'));
      });
    });
  });

  const saveBtn = container.querySelector('#mdmSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{ markDirty(); });
}

function renderCodbRateCardScreen(container){
  const pms = DATA.partnerModels;
  const subCats = DATA.productSubCategories;
  const excludedNames = ['cac'];
  const lineItems = DATA.codbLineItems.filter(li=>{
    if(excludedNames.includes(normalizeText(li.name))) return false;
    const exp = DATA.expenseLineItems.find(x=>x.id===li.expenseLineItemId);
    if(exp && exp.type === 'CAC') return false;
    return true;
  });

  if(!pms.length){ container.innerHTML = `<div class="footnote">No Partner-Models defined yet — add some in "Partner-Model Master" first.</div>`; return; }
  if(!lineItems.length){ container.innerHTML = `<div class="footnote">No CODB Line Items defined yet — add some in "CODB Master" first. (CAC does not appear here — see the standalone "CAC %" tab.)</div>`; return; }
  if(!subCats.length){ container.innerHTML = `<div class="footnote">No Product Sub Categories defined yet — add some in "Pareto Master" first.</div>`; return; }

  const store = getCycleObj('codbRateCardByCycle'); // {pmId: {liId: {subCatId: value}}}
  pms.forEach(pm=>{ if(!store[pm.id]) store[pm.id] = {}; });
  store[ALL_CHANNEL_KEY] = store[ALL_CHANNEL_KEY] || {};

  // One flat table: a column per (Fee Type, Channel) pair, sitting side by side —
  // not stacked blocks going down the page.
  const columns = [];
  lineItems.forEach(li=>{
    getEffectiveChannels(li, pms).forEach(pm=>{
      if(!store[pm.id]) store[pm.id] = {};
      if(!store[pm.id][li.id]) store[pm.id][li.id] = {};
      columns.push({li, pm});
    });
  });

  let html = `<div class="footnote" style="margin-bottom:14px;">One flat table — every Product Sub Category as a row, one column per Fee Type + Channel (or a single "All Channels" column for All-Channel items). CAC is entered separately in its own "CAC %" tab.</div>`;
  html += pasteBoxHtml('Pdt Sub Cat | values in column order (Fee Type + Channel, left to right)', columns.map(c=> `${c.li.name} - ${channelLabel(c.pm)}`).join(' | '));

  let hasData = false;
  columns.forEach(({li,pm})=>{
    const grid = (store[pm.id] && store[pm.id][li.id]) || {};
    if(Object.values(grid).some(v=> v!==undefined && v!=='')) hasData = true;
  });
  if(hasData) html += `<button class="btn-sm danger" id="clearCodbRcBtn" style="margin-bottom:14px;">🗑 Delete all CODB Rate Card data</button>`;

  // Track which column index is the last one in its Fee Type's group, for a
  // visible divider border between fee groups.
  let colCursor = 0;
  const groupEndIdx = new Set();
  lineItems.forEach(li=>{
    const span = getEffectiveChannels(li, pms).length;
    if(span<=0) return;
    colCursor += span;
    groupEndIdx.add(colCursor - 1);
  });

  html += `<div class="panel" style="max-width:100%;"><div class="scrollbox" style="max-height:75vh; overflow-x:auto;"><table class="ledger compact"><colgroup><col style="width:340px;">${columns.map(()=>'<col style="width:150px;">').join('')}</colgroup><thead>`;
  html += `<tr><th class="stickyleftcol"></th>`;
  lineItems.forEach(li=>{
    const span = getEffectiveChannels(li, pms).length;
    if(span<=0) return;
    html += `<th colspan="${span}" class="feegroupend">${li.name}${li.rateBasis ? ` <span style="font-weight:400; color:var(--ink-soft); font-style:italic; font-size:12px;">(${li.rateBasis})</span>` : ''}</th>`;
  });
  html += `</tr><tr><th class="stickyleftcol" style="text-align:left;">Pdt Sub Cat</th>`;
  columns.forEach(({pm}, i)=> html += `<th${groupEndIdx.has(i)?' class="feegroupend"':''}>${channelLabel(pm)}</th>`);

const DEBTOR_BUCKETS = [

      markDirty();
      renderDebtorsScreen(container, onUpdate);

const CREDITOR_BUCKETS = [
  {key:'notdue', label:'Not Due'},
  {key:'b030', label:'0–30'},

  {key:'b180p', label:'>180'}
];
function findExpenseLineByName(name){
  return DATA.expenseLineItems.find(x=> normalizeText(x.name) === normalizeText(name));
}
function renderCreditorsScreen(container, onUpdate){
  const entries = getCycleData('creditorsByCycle'); // [{id, vendorName, expenseLineId, notdue..b180p, payments:{month:val}}]

  let html = `<div class="footnote" style="margin-bottom:10px;">No separate vendor master — paste ageing balances and/or payment overrides below; they auto-group by Expense Line in Creditor Movement below.</div>`;

  html += `<div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;">`;
  html += `<div style="flex:1; min-width:320px;">` + pasteBoxHtml('Vendor | Expense Line | ' + CREDITOR_BUCKETS.map(b=>b.label).join(' | ')) + `</div>`;
  html += `<div style="flex:1; min-width:320px;">` + pasteBoxHtml('Vendor | Expense Line | ' + MONTHS.join(' | ')) + `</div>`;
  html += `</div>`;

  html += `<div style="display:flex; gap:10px; align-items:center; margin-bottom:14px;">`;
  if(entries.length) html += `<button class="btn-sm danger" id="clearCreditorsBtn">🗑 Clear All</button>`;
  html += `<button class="btn-sm" id="expandAllBtn">Expand All</button><button class="btn-sm" id="collapseAllBtn">Collapse All</button>`;
  html += `<span class="footnote" style="margin:0;">Values as entered (incl. GST)</span>`;
  html += `</div>`;

  if(!entries.length){
    html += `<div class="footnote">No creditor data yet — paste vendor balances above to get started.</div>`;
    container.innerHTML = html;
    wireCreditorsPasteBoxes(container, entries, onUpdate);
    return;
  }

  // Group entries by Expense Line (unmatched expense line names still get their own group, labelled by whatever text was pasted).
  const groups = {}; // expenseLineId-or-raw-name -> {label, entries:[]}
  entries.forEach(e=>{
    const exp = e.expenseLineId ? DATA.expenseLineItems.find(x=>x.id===e.expenseLineId) : null;
    const gKey = exp ? exp.id : ('__unmatched__'+normalizeText(e.expenseLineName||''));
    if(!groups[gKey]) groups[gKey] = {label: exp ? exp.name : (e.expenseLineName || '(no expense line)'), entries:[]};
    groups[gKey].entries.push(e);
  });

  html += `<div class="panel" style="max-width:100%;"><div class="scrollbox" style="max-height:70vh; overflow-x:auto;">`;
  html += `<table class="ledger compact"><colgroup><col style="width:260px;">${CREDITOR_BUCKETS.map(()=>'<col style="width:95px;">').join('')}<col style="width:100px;">${MONTHS.map(()=>'<col style="width:85px;">').join('')}</colgroup>`;
  html += `<thead><tr><th class="stickyleftcol" style="text-align:left;">Vendor / Expense Line</th>`;
  CREDITOR_BUCKETS.forEach(b=> html += `<th>${b.label}</th>`);
  html += `<th class="feegroupend">Op Total</th>`;
  MONTHS.forEach(m=> html += `<th>${m}</th>`);
  html += `</tr></thead><tbody>`;

  Object.keys(groups).forEach(gKey=>{
    const g = groups[gKey];
    const groupTotals = {}; CREDITOR_BUCKETS.forEach(b=> groupTotals[b.key]=0);
    const groupMonthTotals = {}; MONTHS.forEach(m=> groupMonthTotals[m]=0);
    let groupOpTotal = 0;
    g.entries.forEach(e=>{
      const eff = vendorEffectivePayments(e);
      CREDITOR_BUCKETS.forEach(b=>{ const v = +e[b.key]||0; groupTotals[b.key]+=v; groupOpTotal+=v; });
      MONTHS.forEach((m,i)=>{ groupMonthTotals[m] += eff[i]; });
    });
    html += `<tr class="section grouprow" data-group="${gKey}" style="cursor:pointer;"><td class="stickyleftcol" style="text-align:left; font-weight:700;"><span class="grouptoggle">▶</span> ${g.label} <span class="footnote" style="margin:0;">(${g.entries.length} vendor${g.entries.length===1?'':'s'})</span></td>`;
    CREDITOR_BUCKETS.forEach(b=> html += `<td style="text-align:right;">${groupTotals[b.key].toLocaleString('en-IN')}</td>`);
    html += `<td class="feegroupend" style="text-align:right; font-weight:700;">${groupOpTotal.toLocaleString('en-IN')}</td>`;
    MONTHS.forEach(m=> html += `<td style="text-align:right;">${groupMonthTotals[m].toLocaleString('en-IN')}</td>`);
    html += `</tr>`;

    g.entries.forEach(e=>{
      let opTotal = 0;
      const eff = vendorEffectivePayments(e);
      html += `<tr class="grouprow-item" data-group="${gKey}" style="display:none;"><td class="stickyleftcol" style="text-align:left; padding-left:28px;">${e.vendorName}</td>`;
      CREDITOR_BUCKETS.forEach(b=>{
        const v = +e[b.key]||0; opTotal += v;
        html += `<td><input type="number" step="any" class="creditorcell" data-id="${e.id}" data-bucket="${b.key}" value="${e[b.key]!==undefined && e[b.key]!==''? e[b.key] : ''}"></td>`;
      });
      html += `<td class="feegroupend" style="text-align:right;">${opTotal.toLocaleString('en-IN')}</td>`;
      MONTHS.forEach((m,i)=>{
        html += `<td><input type="number" step="any" class="creditorpmtcell" data-id="${e.id}" data-month="${m}" value="${eff[i]!==0? eff[i] : ''}"></td>`;
      });
      html += `</tr>`;
    });
  });

  html += `<tr class="subtotal"><td class="stickyleftcol" style="text-align:left;">TOTAL</td>`;
  CREDITOR_BUCKETS.forEach(b=>{
    const total = entries.reduce((a,e)=> a + (+e[b.key]||0), 0);
    html += `<td style="text-align:right;">${total.toLocaleString('en-IN')}</td>`;
  });
  const grandOpTotal = entries.reduce((a,e)=> a + CREDITOR_BUCKETS.reduce((s,b)=> s+(+e[b.key]||0), 0), 0);
  html += `<td class="feegroupend" style="text-align:right;">${grandOpTotal.toLocaleString('en-IN')}</td>`;
  MONTHS.forEach((m,i)=>{
    const total = entries.reduce((a,e)=> a + vendorEffectivePayments(e)[i], 0);
    html += `<td style="text-align:right;">${total.toLocaleString('en-IN')}</td>`;
  });
  html += `</tr>`;

  html += `</tbody></table></div></div>`;

  container.innerHTML = html;

  const clearBtn = container.querySelector('#clearCreditorsBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    if(!confirm('Clear all Creditor data? This cannot be undone.')) return;
    entries.length = 0;
    markDirty();
    renderCreditorsScreen(container, onUpdate);
    if(onUpdate) onUpdate();
  });

  container.querySelectorAll('.grouprow').forEach(row=>{
    row.addEventListener('click', ()=>{
      const gKey = row.dataset.group;
      const isOpen = row.querySelector('.grouptoggle').textContent === '▼';
      row.querySelector('.grouptoggle').textContent = isOpen ? '▶' : '▼';
      container.querySelectorAll(`.grouprow-item[data-group="${CSS.escape(gKey)}"]`).forEach(r=>{
        r.style.display = isOpen ? 'none' : '';
      });
    });
  });
  const expandAllBtn = container.querySelector('#expandAllBtn');
  if(expandAllBtn) expandAllBtn.addEventListener('click', ()=>{
    container.querySelectorAll('.grouptoggle').forEach(t=> t.textContent='▼');
    container.querySelectorAll('.grouprow-item').forEach(r=> r.style.display='');
  });
  const collapseAllBtn = container.querySelector('#collapseAllBtn');
  if(collapseAllBtn) collapseAllBtn.addEventListener('click', ()=>{
    container.querySelectorAll('.grouptoggle').forEach(t=> t.textContent='▶');
    container.querySelectorAll('.grouprow-item').forEach(r=> r.style.display='none');
  });

  container.querySelectorAll('.creditorcell').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const e = entries.find(x=>x.id===inp.dataset.id);
      if(!e) return;
      const n = cleanNum(inp.value);
      e[inp.dataset.bucket] = n===null ? '' : n;
      markDirty();
      renderCreditorsScreen(container, onUpdate);
      if(onUpdate) onUpdate();
    });
  });
  container.querySelectorAll('.creditorpmtcell').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const e = entries.find(x=>x.id===inp.dataset.id);
      if(!e) return;
      if(!e.payments) e.payments = {};
      const n = cleanNum(inp.value);
      e.payments[inp.dataset.month] = n===null ? '' : n;
      markDirty();
      renderCreditorsScreen(container, onUpdate);
      if(onUpdate) onUpdate();
    });
  });

  wireCreditorsPasteBoxes(container, entries, onUpdate);
}

function findOrCreateCreditorEntry(entries, vendorName, expenseLineName){
  const exp = findExpenseLineByName(expenseLineName);
  let e = entries.find(x=> normalizeText(x.vendorName)===normalizeText(vendorName) &&
    (exp ? x.expenseLineId===exp.id : normalizeText(x.expenseLineName||'')===normalizeText(expenseLineName)));
  if(!e){
    e = {id: uid('VEN'), vendorName};
    if(exp) e.expenseLineId = exp.id; else e.expenseLineName = expenseLineName;
    entries.push(e);
  }
  return e;
}
function wireCreditorsPasteBoxes(container, entries, onUpdate){
  const pasteBoxes = container.querySelectorAll('.pastebox');
  const balBox = pasteBoxes[0];
  const pmtBox = pasteBoxes[1];
  if(balBox){
    const importBtn = balBox.querySelector('#importBtn');
    const clearBtn = balBox.querySelector('#clearPasteBtn');
    if(importBtn) importBtn.addEventListener('click', ()=>{
      const text = balBox.querySelector('#pasteArea').value;
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      lines.forEach(line=>{
        const parts = line.split('\t');
        if(parts.length < 3) return;
        const e = findOrCreateCreditorEntry(entries, parts[0].trim(), parts[1].trim());
        CREDITOR_BUCKETS.forEach((b,i)=>{
          const n = cleanNum(parts[i+2]);
          if(n !== null) e[b.key] = n;
        });
      });
      markDirty();
      renderCreditorsScreen(container, onUpdate);
      if(onUpdate) onUpdate();
    });
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ balBox.querySelector('#pasteArea').value=''; });
  }
  if(pmtBox){

// Generic "first item auto-balances to 100%" helper used by Channel Mix,
// Category Mix and Pareto Mix — the first item in the list is never directly
// editable; its % is always 100 minus whatever the other items sum to, so
// the group can never fail to total 100%.
function getDifferentialPct(items, mixObj, itemId, month){
  const idx = items.findIndex(it=>it.id===itemId);
  if(idx <= 0){
    let sumOthers = 0;
    for(let i=1;i<items.length;i++) sumOthers += (+((mixObj[items[i].id]||{})[month])||0);
    return 100 - sumOthers;
  }
  return (+((mixObj[itemId]||{})[month])||0);
}
function pctCellHtml(items, mixObj, item, itemIdx, month, cellClass, dataAttrName){
  if(itemIdx === 0){
    const v = getDifferentialPct(items, mixObj, item.id, month);
    const color = v < 0 ? 'var(--neg)' : 'var(--ink-soft)';
    return `<td style="font-style:italic; color:${color};" title="Auto-balances to 100%">${v.toFixed(2)}</td>`;
  }
  const raw = (mixObj[item.id]||{})[month];
  const display = (raw!==undefined && raw!=='') ? Number(raw).toFixed(2) : '';
  return `<td><input type="number" step="0.01" class="${cellClass}" data-${dataAttrName}="${item.id}" data-month="${month}" value="${display}"></td>`;
}

function pctTotalCell(total){
  const near100 = Math.abs(total-100) < 0.01;
  const color = total===0 ? 'var(--ink-soft)' : (near100 ? 'var(--gold)' : 'var(--neg)');
  return `<td style="color:${color}; font-weight:700;">${total.toFixed(2)}%</td>`;
}

function pmLabel(pm){ return `${pm.partner} (${pm.model})`; }

function escapeAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}
function pasteBoxHtml(hint, fullTooltip){
  const columns = (fullTooltip || hint);
  return `<div class="pastebox" title="Columns: ${fullTooltip || hint}">
    <span class="pastebox-label">Paste (${hint}):</span>
    <textarea id="pasteArea" placeholder="Ctrl+V…"></textarea>
    <div class="pastebox-btns">
      <button class="btn-sm primary" id="importBtn">Import</button>
      <button class="btn-sm" id="clearPasteBtn">Clear</button>
      <button class="btn-sm downloadFormatBtn" data-columns="${escapeAttr(columns)}" title="Download an Excel template with these column headers">⬇ Format</button>
    </div>
  </div>`;
}
function wirePasteBox(host, onImport){
  const importBtn = host.querySelector('#importBtn');
  if(importBtn) importBtn.addEventListener('click', ()=>{
    const text = host.querySelector('#pasteArea').value;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    onImport(lines.map(l=>l.split('\t')));
  });
  const clearBtn = host.querySelector('#clearPasteBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ host.querySelector('#pasteArea').value=''; });
}
// One delegated listener handles every "Download format" button across the whole
// app. Rather than relying on a static column-name string, it reads the actual
// rendered <table> next to this paste box — so the download includes the real
// header structure (including multi-row/colspan headers), every row's left-side
// label, and any values already entered, not just blank column names.
function findTableForPasteBox(btn){
  const pastebox = btn.closest('.pastebox');
  if(!pastebox) return null;
  let el = pastebox.nextElementSibling;
  while(el){
    const t = el.matches('table') ? el : el.querySelector('table');
    if(t) return t;
    el = el.nextElementSibling;
  }
  return null;
}
function isUiOnlyCell(cell){
  if(cell.classList.contains('actionscell')) return true;
  if(cell.querySelector('input.rowsel, input#selAll')) return true;
  return false;
}
function cellText(td){
  const select = td.querySelector('select');
  if(select) return select.options[select.selectedIndex] ? select.options[select.selectedIndex].text : '';
  const checkbox = td.querySelector('input[type=checkbox]');
  if(checkbox) return checkbox.checked ? 'Yes' : 'No';
  const input = td.querySelector('input');
  if(input) return input.value;
  return td.textContent.trim();
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.downloadFormatBtn');
  if(!btn) return;
  if(typeof XLSX === 'undefined') return;

  const table = findTableForPasteBox(btn);
  const label = document.getElementById('panelTitle') ? document.getElementById('panelTitle').textContent : 'FinFables';
  const filename = label.replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '') + '_format.xlsx';
  const wb = XLSX.utils.book_new();
  const merges = [];
  let aoa = [];

  if(table){
    const theadRows = Array.from(table.querySelectorAll('thead tr'));
    theadRows.forEach((tr, r)=>{
      const row = [];
      let col = 0;
      Array.from(tr.children).forEach(th=>{
        if(isUiOnlyCell(th)) return;
        const span = parseInt(th.getAttribute('colspan')||'1', 10);
        const text = th.textContent.trim();
        row[col] = text;
        for(let i=1;i<span;i++) row[col+i] = '';
        if(span > 1) merges.push({s:{r,c:col}, e:{r,c:col+span-1}});
        col += span;
      });
      aoa.push(row);
    });
    const tbodyRows = Array.from(table.querySelectorAll('tbody tr'));
    tbodyRows.forEach(tr=>{
      aoa.push(Array.from(tr.children).filter(td=>!isUiOnlyCell(td)).map(cellText));
    });
  }

  if(!aoa.length || !aoa[0].length){
    // Fallback for any screen without a findable table — header names only.
    const columns = (btn.dataset.columns || '').split('|').map(s=>s.trim()).filter(Boolean);
    if(!columns.length) return;
    aoa = [columns];
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if(merges.length) ws['!merges'] = merges;
  XLSX.utils.book_append_sheet(wb, ws, 'Format');
  XLSX.writeFile(wb, filename);
});

// Unlike `val || fallback`, this correctly keeps an explicit 0 (e.g. "0 days
// credit terms", paid same month) instead of treating it as unset and falling
// through to the default - `0 || 30` would wrongly evaluate to 30 in JS.
function numOr(val, fallback){
  return (val !== undefined && val !== null && val !== '') ? +val : fallback;
}

function cleanNum(text){
  const n = parseFloat(String(text||'').replace(/[,₹$\s]/g,''));
  return isNaN(n) ? null : n;
}
// Used when matching a pasted row name against a master's stored name —
// collapses any run of whitespace to a single space and trims, so a
// double-space (very common when names are typed/copied from Excel) doesn't
// silently fail to match and cause that row's paste to be dropped.
// A CODB Line Item with no channel mapping ticked shows for every Partner-Model
// (unfiltered, backward compatible); once any box is ticked, only those show.
function isChannelMapped(li, pmId){
  if(!li.mappedPartnerModels || !li.mappedPartnerModels.length) return true;
  return li.mappedPartnerModels.includes(pmId);
}

// A CODB Line Item ticked "All Channel" takes its input once and applies it to
// every channel, instead of once per Partner-Model — represented as a single
// synthetic "channel" so the same rendering/storage code path works for both.
const ALL_CHANNEL_KEY = '__ALL__';
function getEffectiveChannels(li, pms){
  if(li.allChannel) return [{id: ALL_CHANNEL_KEY, __isAllChannel: true}];
  return pms.filter(pm=> isChannelMapped(li, pm.id));
}
function channelLabel(pm){
  return pm.__isAllChannel ? 'All Channels' : pmLabel(pm);
}

function normalizeText(s){
  return String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
}
// Product Sub Categories carry a Weight; CODB Marketplace/Other fees need rows
// keyed by the unique (Product Category, Weight) combination found across all
// Sub Categories, not one row per Sub Category or one row per bare Category.
function getUniquePdtCatWeightCombos(){
  const seen = new Map();
  DATA.productSubCategories.forEach(sc=>{
    const catId = sc.productCategoryId;
    if(!catId) return;
    const weight = sc.weight;
    const key = catId + '::' + (weight ?? '');
    if(!seen.has(key)){
      const cat = DATA.productCategories.find(c=>c.id===catId);
      seen.set(key, {key, catId, catName: cat ? cat.name : '—', weight});
    }
  });
  return Array.from(seen.values());
}

      mix[inp.dataset.sc][inp.dataset.month] = inp.value===''?'':parseFloat(inp.value);

    });

function renderRateGrid(host, metric, label, pms){
  const store = getCycleObj('discMarginGstByCycle');
  if(!store[metric]) store[metric] = {};
  const grid = store[metric];
  pms.forEach(pm=>{ if(!grid[pm.id]) grid[pm.id] = {}; });

  const cellClass = metric + 'ratecell';
  let html = `<div class="cyclelabel" style="color:var(--ink); margin:0 0 8px 0; font-size:13px; font-weight:700;">${label}</div>`;
  html += pasteBoxHtml('Month | ' + pms.map(pmLabel).join(' | '));

  const hasData = pms.some(pm=> Object.values(grid[pm.id]||{}).some(v=> v!==undefined && v!==''));
  if(hasData) html += `<button class="btn-sm danger" data-clearmetric="${metric}" style="margin-bottom:10px;">🗑 Delete all ${label} data</button>`;

  html += `<div class="panel"><div class="scrollbox" style="max-height:460px; overflow-x:auto;"><table class="ledger compact"><colgroup><col style="width:110px;">${pms.map(()=>'<col style="width:140px;">').join('')}</colgroup><thead><tr><th>Month</th>`;
  pms.forEach(pm=> html += `<th>${pmLabel(pm)}</th>`);
  html += `</tr></thead><tbody>`;
  MONTHS.forEach(m=>{
    html += `<tr><td>${m}</td>`;
    pms.forEach(pm=>{
      const v = grid[pm.id][m];
      const display = (v!==undefined && v!=='') ? Number(v).toFixed(2) : '';
      html += `<td><input type="number" step="0.01" class="${cellClass}" data-pm="${pm.id}" data-month="${m}" value="${display}"></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table></div></div>`;
  return html;
}

function renderDiscMarginGst(container){
  const pms = DATA.partnerModels;

    container.innerHTML = `<div class="footnote">No Partner-Models defined yet — add some in "3. Partner-Model master" first.</div>`;

  }
  // COD % Sales only makes sense for channels where COD is actually offered —
  // reuse the same Channel Mapping already set on the "COD Charges" CODB Line
  // Item (Rate Basis & Structure tab) so the two stay consistent.
  function channelsForMetric(metricKey){
    if(metricKey === 'codPct'){
      const codLi = getCodbLineItemByName('COD Charges');
      if(!codLi) return pms;
      if(codLi.allChannel) return pms;
      return getEffectiveChannels(codLi, pms);

  }

  let html = `<div class="footnote" style="margin-bottom:14px;">Partner-Model wise, month wise. GST% now lives on the Product Sub Category (Pareto Master, tab 7). Will later apply as: Discount% on MRP → Margin% on (MRP − Discount) → GST% (from Pareto Master) on (MRP − Discount − Margin)/(1+GST%)×GST%. COD % Sales only shows channels mapped for "COD Charges" in CODB Master → Rate Basis &amp; Structure.</div>`;

    btn.addEventListener('click', ()=>{

    const grid = store[metric];

        grid[inp.dataset.pm][inp.dataset.month] = n===null ? '' : n;
        markDirty();
        renderDiscMarginGst(container);
      });
    });
  });

  // Each metric's paste box is matched to its grid by DOM order (one .pastebox per grid, in the same order as DMG_METRICS).
  const pasteBoxes = container.querySelectorAll('.pastebox');
  let boxIdx = 0;
  DMG_METRICS.forEach(({key:metric})=>{
    const metricPms = channelsForMetric(metric);
    if(!metricPms.length) return; // no grid/pastebox was rendered for this metric
    const box = pasteBoxes[boxIdx]; boxIdx++;
    if(!box) return;
    const grid = store[metric];
    const importBtn = box.querySelector('#importBtn');
    const clearBtn = box.querySelector('#clearPasteBtn');
    if(importBtn) importBtn.addEventListener('click', ()=>{
      const text = box.querySelector('#pasteArea').value;
      const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      lines.forEach(line=>{
        const parts = line.split('\t');
        if(parts.length < 2) return;
        const month = parts[0].trim();
        if(!MONTHS.includes(month)) return;
        metricPms.forEach((pm,i2)=>{
          if(!grid[pm.id]) grid[pm.id] = {};
          const n = cleanNum(parts[i2+1]);
          if(n !== null) grid[pm.id][month] = n;
        });
      });
      markDirty();
      renderDiscMarginGst(container);
    });
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ box.querySelector('#pasteArea').value=''; });
  });
}
