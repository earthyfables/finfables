<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinFables — Annual Budget Ledger</title>
<style>
  :root{
    --bg:#EEF1F7;
    --surface:#FFFFFF;
    --ink:#1B2338;
    --ink-soft:#69708A;
    --line:#DEE3ED;
    --accent:#2B4494;
    --accent-dark:#16204A;
    --accent-soft:#E7EBF8;
    --gold:#0B7A56;
    --gold-soft:#E1F3EC;
    --neg:#B23A3A;
    --neg-soft:#F8E9E9;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(22,32,74,0.06), 0 1px 1px rgba(22,32,74,0.04);
    --shadow-md:0 4px 14px rgba(22,32,74,0.08), 0 1px 3px rgba(22,32,74,0.06);
    --shadow-lg:0 10px 30px rgba(22,32,74,0.14), 0 2px 8px rgba(22,32,74,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Times New Roman', Times, serif;
    font-size:14.5px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:264px; flex:none;
    background:linear-gradient(160deg, #182552 0%, #0D1631 100%);
    color:#B9C1DC;
    padding:26px 0 24px 0;
    display:flex; flex-direction:column;
    box-shadow: var(--shadow-lg);
    position:relative;
  }
  .sidebar::after{
    content:''; position:absolute; top:0; right:0; width:1px; height:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0));
  }
  .brandmark{
    font-family:'Times New Roman', Times, serif;
    font-size:22px; font-weight:700; letter-spacing:0.01em;
    padding:0 24px 16px 24px;
    color:#FFFFFF;
    border-bottom:1px solid rgba(255,255,255,0.12);
    margin:0 22px 8px 22px;
    display:flex; align-items:baseline; gap:8px;
  }
  .brandmark .seed{font-style:normal; font-size:15px; color:var(--gold);}
  .brandmark small{display:block; font-size:10.5px; color:#8590B3; font-weight:400; margin-top:6px; letter-spacing:0.1em; text-transform:uppercase; font-style:normal; font-family:'Times New Roman', Times, serif;}
  .navgroup{margin-top:22px;}
  .navgroup h4{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em;
    color:#6B76A0; margin:0; padding:8px 24px 8px 24px; font-weight:700;
  }
  .navitem{
    display:block; width:100%; text-align:left; background:none; border:none;
    color:#B9C1DC; padding:9px 24px; font-size:13.8px; cursor:pointer;
    border-left:3px solid transparent; font-family:inherit;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .navitem:hover{background:rgba(255,255,255,0.05); color:#fff;}
  .navitem.active{background:linear-gradient(90deg, rgba(43,68,148,0.35), rgba(43,68,148,0.05)); border-left-color:#6C8CE0; color:#fff; font-weight:700;}

  /* Main */
  .main{flex:1; min-width:0; padding:30px 38px 60px 38px;}
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:26px; flex-wrap:wrap; gap:12px;
    padding-bottom:18px; border-bottom:1px solid var(--line);
  }
  .titleblock h1{
    font-family:'Times New Roman', Times, serif;
    font-size:25px; margin:0 0 4px 0; font-weight:700;
    color:var(--ink); letter-spacing:0.01em;
  }
  .titleblock .sub{color:var(--ink-soft); font-size:13px; font-style:italic;}
  #fileInput{display:none;}

  .btn{
    font-family:'Times New Roman', Times, serif; font-size:13px; padding:9px 17px; border-radius:7px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; font-weight:700; transition:all 0.15s ease;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{border-color:var(--accent); color:var(--accent); box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .btn.primary{background:linear-gradient(180deg, var(--accent), var(--accent-dark)); color:#fff; border-color:var(--accent-dark);}
  .btn.primary:hover{color:#fff; box-shadow:var(--shadow-md);}
  .btn.danger{background:var(--surface); color:var(--neg); border-color:#E3B8B8;}
  .btn.danger:hover{background:var(--neg-soft); box-shadow:var(--shadow-md);}

  /* Masters & Config: horizontal tab bar */
  .mastertabbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  .mastertab{
    font-family:'Times New Roman', Times, serif; font-size:13.5px; font-weight:700;
    padding:9px 16px; border-radius:7px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); cursor:pointer; transition:all 0.15s ease;
  }
  .mastertab:hover{border-color:var(--accent); color:var(--accent);}
  .mastertab.active{background:linear-gradient(180deg, var(--accent), var(--accent-dark)); color:#fff; border-color:var(--accent-dark); box-shadow:var(--shadow-sm);}

  /* Paste-from-Excel box */
  .pastebox{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:18px; background:#FAFBFD;}
  .pastebox-label{font-size:13px; font-weight:700; color:var(--ink); margin-bottom:8px;}
  .pastebox-row{display:flex; gap:12px; align-items:flex-start;}
  .pastebox textarea{
    flex:1; min-height:64px; resize:vertical; font-family:'Times New Roman', Times, serif; font-size:13px;
    border:1px solid var(--line); border-radius:6px; padding:9px 11px; color:var(--ink); background:#fff;
  }
  .pastebox textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .pastebox-btns{display:flex; flex-direction:column; gap:8px;}

  /* Inline add-row form */
  .addform{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;}
  .addfield{display:flex; flex-direction:column; gap:4px; min-width:130px;}
  .addfield label{font-size:11px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.05em;}
  .addfield input,.addfield select{border:1px solid var(--line); border-radius:6px; padding:8px 10px;}
  .addfield input:focus,.addfield select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .addform .addbtn{align-self:flex-end;}

  .savenote{font-size:11.5px; color:var(--ink-soft); font-style:italic;}

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px 26px; margin-bottom:22px;
    box-shadow:var(--shadow-sm);
  }
  .panel h2{
    font-family:'Times New Roman', Times, serif;
    font-size:18px; margin:0 0 5px 0; font-weight:700;
  }
  .panel .desc{color:var(--ink-soft); font-size:13px; margin-bottom:16px; font-style:italic;}

  /* KPI cards */
  .kpirow{display:flex; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .kpi{
    flex:1; min-width:170px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 20px; position:relative; overflow:hidden;
    box-shadow:var(--shadow-sm); transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  .kpi:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
  .kpi::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%;
    background:linear-gradient(180deg, var(--accent), var(--accent-dark));
  }
  .kpi.negtone::before{background:linear-gradient(180deg, var(--neg), #8A2C2C);}
  .kpi .kpilabel{font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:700; margin-bottom:7px;}
  .kpi .kpival{font-family:'Times New Roman', Times, serif; font-size:23px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;}
  .kpi .kpival.neg{color:var(--neg);}
  .kpi .kpisub{font-size:11.5px; color:var(--ink-soft); margin-top:4px; font-style:italic;}

  table{width:100%; border-collapse:collapse; font-size:13.3px;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--ink-soft); border-bottom:2px solid var(--line); padding:9px 10px; font-weight:700;
    white-space:nowrap;
  }
  tbody td{padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr{transition:background 0.1s ease;}
  tbody tr:hover{background:#F5F7FC;}
  input[type=text],input[type=number],select{
    width:100%; border:1px solid transparent; background:transparent;
    font-family:'Times New Roman', Times, serif; font-size:13.3px; padding:6px 8px; border-radius:5px; color:var(--ink);
  }
  input[type=text]:hover,input[type=number]:hover,select:hover{border-color:var(--line);}
  input[type=text]:focus,input[type=number]:focus,select:focus{
    outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-soft);
  }
  input[type=number]{font-variant-numeric:tabular-nums; text-align:right; font-family:'Times New Roman', Times, serif;}
  .num{font-variant-numeric:tabular-nums; text-align:right; font-family:'Times New Roman', Times, serif;}
  .rowdel{
    border:none; background:none; color:#A6AECB; cursor:pointer; font-size:15px; line-height:1;
    padding:3px 8px; border-radius:5px; transition:all 0.12s ease;
  }
  .rowdel:hover{color:var(--neg); background:var(--neg-soft);}
  .addrow{
    margin-top:14px; font-size:13px; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border:1px dashed #A9B7E6; border-radius:7px;
    padding:9px 16px; cursor:pointer; transition:all 0.15s ease;
    font-family:'Times New Roman', Times, serif;
  }
  .addrow:hover{background:#D6DEF5; box-shadow:var(--shadow-sm);}

  /* Output ledger tables */
  .ledger{width:100%; border-collapse:collapse; font-family:'Times New Roman', Times, serif; font-size:13px;}
  .ledger th{
    text-align:right; padding:8px 11px; border-bottom:2px solid var(--accent-dark);
    font-family:'Times New Roman', Times, serif; font-weight:700; white-space:nowrap; color:var(--ink-soft);
    text-transform:uppercase; font-size:10.5px; letter-spacing:0.06em;
  }
  .ledger th:first-child{text-align:left;}
  .ledger td{padding:6px 11px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .ledger td:first-child{text-align:left; white-space:normal; font-variant-numeric:normal;}
  .ledger tr.section td:first-child{font-weight:700; color:var(--ink); padding-top:18px; font-size:14px;}
  .ledger tr.subtotal td{font-weight:700; border-top:1px solid var(--ink); border-bottom:1px double var(--ink);}
  .ledger tr.grand td{font-weight:700; border-top:2px solid var(--accent); color:var(--ink); font-size:14.5px; background:var(--accent-soft);}
  .ledger tr.lineitem td:first-child{color:var(--ink-soft); padding-left:22px;}
  .ledger tr.neg td{color:var(--neg);}
  .ledger td.total-col{border-left:2px solid var(--line); font-weight:700;}
  .pct{color:var(--ink-soft); font-size:11.5px;}

  .tag{font-size:10.5px; padding:2px 9px; border-radius:99px; font-weight:700; letter-spacing:0.03em;}
  .tag.CODB{background:var(--accent-soft); color:var(--accent);}
  .tag.CIDB{background:var(--neg-soft); color:var(--neg);}
  .tag.MISC{background:var(--gold-soft); color:var(--gold);}

  .footnote{font-size:12px; color:var(--ink-soft); margin-top:12px; line-height:1.6; font-style:italic;}
  .hidden{display:none !important;}

  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; padding:16px 0;}
    .main{padding:20px;}
    .kpirow{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app">

  <nav class="sidebar">
    <div class="brandmark">FinFables<span class="seed">🌱</span><small id="fyLabel">Annual Budget</small></div>

    <div class="navgroup">
      <h4>Masters</h4>
      <button class="navitem" data-tab="brands">1. Brand Master</button>
      <button class="navitem" data-tab="partnerModels">2. Partner-Model Master</button>
      <button class="navitem" data-tab="brandPartnerMapping">3. Brand → Partner Mapping</button>
      <button class="navitem" data-tab="expenseLineItems">4. Expense Line Item Master</button>
      <button class="navitem" data-tab="codbDeductionMapping">5. CODB Deduction Mapping</button>
      <button class="navitem" data-tab="skuMaster">SKU Master</button>
    </div>

    <div class="navgroup">
      <h4>Inputs</h4>
      <button class="navitem" data-tab="salesInput">SKU × Channel Sales Input</button>
      <button class="navitem" data-tab="codbRateCard">CODB Rate Card</button>
      <button class="navitem" data-tab="cidbRateCard">CIDB Rate Card</button>
      <button class="navitem" data-tab="miscInputs">Misc. Inputs</button>
      <button class="navitem" data-tab="cashFlowItems">Cash Flow Adjustments</button>
    </div>

    <div class="navgroup">
      <h4>Output</h4>
      <button class="navitem" data-tab="outputPL">Profit &amp; Loss</button>
      <button class="navitem" data-tab="outputCF">Cash Flow</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div class="titleblock">
        <h1 id="panelTitle">Brand Master</h1>
        <div class="sub" id="panelSub">Loading…</div>
      </div>
    </div>

    <div id="content"></div>
  </main>
</div>

<script>
/* ---------------------------------------------------------------
   STATE — loaded from data.json (sibling file). Falls back to a
   minimal seed if the fetch fails (e.g. opened via file:// where
   local fetch is blocked by the browser). On GitHub Pages / any
   http server, data.json will load normally.
   ----------------------------------------------------------------*/
let DATA = null;
const MONTHS = ["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
const BRAND_GROUP_OPTIONS = ["Focus","Non Focus","Rainbow"];
const COHORT_OPTIONS = ["Coh1","Coh2","Coh3"];
const MODEL_OPTIONS = ["B2C","B2B"];
const PARTNER_GROUP_OPTIONS = ["Website","FAM","MAN","Stores","Other MP","Other Offline"];
const GMV_GROUPING_OPTIONS = ["GMV","Pry"];

const SEED = {
  meta:{fyLabel:"FY 2026-27", months:MONTHS, savedAt:null},
  channels:[{id:"CH1",name:"General Trade"},{id:"CH2",name:"Modern Trade"},{id:"CH3",name:"E-commerce"}],
  brands:[{id:"BR1",name:"Brand A",brand2:"Brand A",brandGroup:"Focus",cohort:"Coh1"}],
  partnerModels:[{id:"PM1",partner:"Website",model:"B2C",partnerGroup:"Website"}],
  brandPartnerMapping:[{id:"BPM1",brandId:"BR1",partner:"Website",model:"B2C",creditDays:30,gmvGrouping:"Pry"}],
  expenseLineItems:[
    {id:"EL1",name:"Trade Scheme",category:"Other Expenses",gstRate:18,creditorDays:30,type:"CODB"},
    {id:"EL2",name:"Logistics / Freight",category:"Other Expenses",gstRate:18,creditorDays:30,type:"CODB"},
    {id:"EL6",name:"Brand Marketing",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"},
    {id:"EL7",name:"Salaries",category:"Other Expenses",gstRate:0,creditorDays:0,type:"MISC"},
    {id:"EL8",name:"Overheads",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"},
    {id:"EL9",name:"Rent",category:"Other Expenses",gstRate:18,creditorDays:30,type:"MISC"}
  ],
  codbLineItems:[], marketplaceDeductionMapping:[],
  skuMaster:[{id:"SKU1",name:"SKU 500ml",brandId:"BR1",amrp:100,acogs:40,gstPct:18}],
  salesInput:[], codbRateCard:[], cidbRateCard:[], miscInputs:[], cashFlowItems:[]
};

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,8); }

async function loadData(){
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('no file');
    DATA = await res.json();
  }catch(e){
    DATA = JSON.parse(JSON.stringify(SEED));
  }
  // Migration: backfill any fields/arrays introduced after this data.json was last saved,
  // so older saved files keep working without losing existing rows.
  ['codbRateCard','cidbRateCard','cashFlowItems','codbLineItems','marketplaceDeductionMapping'].forEach(k=>{ if(!DATA[k]) DATA[k]=[]; });
  (DATA.brands||[]).forEach(b=>{
    if(b.brand2===undefined) b.brand2 = b.name || '';
    if(b.brandGroup===undefined) b.brandGroup = '';
    if(b.cohort===undefined) b.cohort = '';
  });
  (DATA.partnerModels||[]).forEach(p=>{
    if(p.partner===undefined) p.partner = p.name || '';
    if(p.model===undefined || !MODEL_OPTIONS.includes(p.model)) p.model = p.model || '';
    if(p.partnerGroup===undefined) p.partnerGroup = '';
  });
  (DATA.brandPartnerMapping||[]).forEach(m=>{
    if(m.partner===undefined) m.partner = '';
    if(m.model===undefined) m.model = '';
    if(m.creditDays===undefined) m.creditDays = '';
    if(m.gmvGrouping===undefined) m.gmvGrouping = '';
  });
  (DATA.expenseLineItems||[]).forEach(x=>{
    if(x.category===undefined) x.category = 'Other Expenses';
    if(x.gstRate===undefined) x.gstRate = '';
    if(x.creditorDays===undefined) x.creditorDays = '';
  });
  document.getElementById('fyLabel').textContent = DATA.meta?.fyLabel || 'Annual Budget';
  render();
}

/* ---------------------------------------------------------------
   GENERIC TABLE EDITOR
   ----------------------------------------------------------------*/
function fieldInput(row, col){
  const val = row[col.key] ?? '';
  if(col.type === 'select'){
    const opts = col.options();
    let html = `<select data-key="${col.key}">`;
    html += `<option value="">—</option>`;
    opts.forEach(o=>{
      html += `<option value="${o.id}" ${o.id===val?'selected':''}>${o.label}</option>`;
    });
    html += `</select>`;
    return html;
  }
  if(col.type === 'number'){
    return `<input type="number" step="any" data-key="${col.key}" value="${val}">`;
  }
  return `<input type="text" data-key="${col.key}" value="${val}">`;
}

function renderEditableTable(container, arr, cols, opts){
  opts = opts || {};
  let html = `<table><thead><tr>`;
  cols.forEach(c=> html += `<th>${c.label}</th>`);
  html += `<th style="width:30px;"></th></tr></thead><tbody>`;
  arr.forEach((row,idx)=>{
    html += `<tr data-idx="${idx}">`;
    cols.forEach(c=> html += `<td>${fieldInput(row,c)}</td>`);
    html += `<td><button class="rowdel" data-del="${idx}" title="Delete row">✕</button></td></tr>`;
  });
  html += `</tbody></table><button class="addrow" id="addRowBtn">+ Add row</button>`;
  container.innerHTML = html;

  container.querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('change', e=>{
      const tr = e.target.closest('tr');
      const idx = +tr.dataset.idx;
      const key = e.target.dataset.key;
      let v = e.target.value;
      if(e.target.type === 'number') v = v === '' ? '' : parseFloat(v);
      arr[idx][key] = v;
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });
  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      arr.splice(+btn.dataset.del,1);
      renderEditableTable(container, arr, cols, opts);
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });
  container.querySelector('#addRowBtn').addEventListener('click', ()=>{
    const blank = {id: uid(opts.prefix||'ROW')};
    cols.forEach(c=> blank[c.key] = c.default !== undefined ? c.default : '');
    arr.push(blank);
    renderEditableTable(container, arr, cols, opts);
    markDirty();
  });
}

function markDirty(){
}

/* ---------------------------------------------------------------
   MASTER TABLE — richer editor used for the Masters & Config screens:
   paste-from-Excel bulk import, inline add-row form, checkbox
   multi-select with "Delete selected", per-row Edit/Remove buttons.
   ----------------------------------------------------------------*/
function resolveValueForCol(col, text){
  text = (text||'').trim();
  if(col.type === 'select'){
    const opts = col.options();
    const hit = opts.find(o=> o.label.toLowerCase() === text.toLowerCase());
    return hit ? hit.id : '';
  }
  if(col.type === 'number'){
    const n = parseFloat(text);
    return isNaN(n) ? '' : n;
  }
  return text;
}

function renderMasterTable(container, arr, cols, opts){
  opts = opts || {};
  const pasteHint = cols.map(c=>c.label).join(' | ');

  let html = '';
  if(opts.paste !== false){
    html += `<div class="pastebox">
      <div class="pastebox-label">📋 Paste from Excel — columns: ${pasteHint}</div>
      <div class="pastebox-row">
        <textarea id="pasteArea" placeholder="Copy cells from Excel and paste here (Ctrl+V)…"></textarea>
        <div class="pastebox-btns">
          <button class="btn primary" id="importBtn">Import rows</button>
          <button class="btn" id="clearPasteBtn">Clear</button>
        </div>
      </div>
    </div>`;
  }

  html += `<div class="addform">`;
  cols.forEach(c=>{
    html += `<div class="addfield"><label>${c.label}</label>${fieldInput({}, c).replace('data-key','data-addkey')}</div>`;
  });
  html += `<button class="btn primary addbtn" id="addRowBtn2">${opts.addLabel || 'Add'}</button>`;
  html += `</div>`;

  html += `<button class="btn danger" id="deleteSelBtn">Delete selected</button>`;

  html += `<table><thead><tr><th style="width:26px;"><input type="checkbox" id="selAll"></th>`;
  cols.forEach(c=> html += `<th>${c.label}</th>`);
  html += `<th style="width:130px;"></th></tr></thead><tbody>`;
  arr.forEach((row,idx)=>{
    html += `<tr data-idx="${idx}"><td><input type="checkbox" class="rowsel" data-selidx="${idx}"></td>`;
    cols.forEach(c=> html += `<td>${fieldInput(row,c)}</td>`);
    html += `<td><button class="btn" data-editidx="${idx}">Edit</button> <button class="btn danger" data-del="${idx}">Remove</button></td></tr>`;
  });
  html += `</tbody></table>`;

  container.innerHTML = html;

  function rerender(){ renderMasterTable(container, arr, cols, opts); if(opts.onChange) opts.onChange(); markDirty(); }

  container.querySelectorAll('tbody input[data-key],tbody select[data-key]').forEach(el=>{
    el.addEventListener('change', e=>{
      const tr = e.target.closest('tr');
      const idx = +tr.dataset.idx;
      const key = e.target.dataset.key;
      let v = e.target.value;
      if(e.target.type === 'number') v = v === '' ? '' : parseFloat(v);
      arr[idx][key] = v;
      if(opts.onChange) opts.onChange();
      markDirty();
    });
  });

  container.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', e=>{ arr.splice(+btn.dataset.del,1); rerender(); });
  });

  container.querySelectorAll('[data-editidx]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const tr = btn.closest('tr');
      const firstField = tr.querySelector('input,select');
      if(firstField) firstField.focus();
    });
  });

  const selAll = container.querySelector('#selAll');
  if(selAll) selAll.addEventListener('change', ()=>{
    container.querySelectorAll('.rowsel').forEach(cb=> cb.checked = selAll.checked);
  });

  const delSelBtn = container.querySelector('#deleteSelBtn');
  if(delSelBtn) delSelBtn.addEventListener('click', ()=>{
    const idxs = Array.from(container.querySelectorAll('.rowsel:checked')).map(cb=>+cb.dataset.selidx);
    if(!idxs.length) return;
    idxs.sort((a,b)=>b-a).forEach(i=> arr.splice(i,1));
    rerender();
  });

  const addBtn = container.querySelector('#addRowBtn2');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    const row = {id: uid(opts.prefix||'ROW')};
    container.querySelectorAll('[data-addkey]').forEach(el=>{
      let v = el.value;
      if(el.type === 'number') v = v === '' ? '' : parseFloat(v);
      row[el.dataset.addkey] = v;
    });
    if(opts.buildRow) Object.assign(row, opts.buildRow(row) || {});
    arr.push(row);
    rerender();
  });

  const importBtn = container.querySelector('#importBtn');
  if(importBtn) importBtn.addEventListener('click', ()=>{
    const text = container.querySelector('#pasteArea').value;
    const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    lines.forEach(line=>{
      const parts = line.split('\t');
      const row = {id: uid(opts.prefix||'ROW')};
      cols.forEach((c,i)=>{ row[c.key] = resolveValueForCol(c, parts[i]); });
      if(opts.buildRow) Object.assign(row, opts.buildRow(row) || {});
      arr.push(row);
    });
    rerender();
  });

  const clearBtn = container.querySelector('#clearPasteBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    container.querySelector('#pasteArea').value = '';
  });
}

function renderMarketplaceDeductionMapping(container){

  const isChecked = (brandId, pmId, itemId)=> DATA.marketplaceDeductionMapping.some(m=> m.brandId===brandId && m.partnerModelId===pmId && m.codbLineItemId===itemId);

  let html = `<h2 style="margin-top:0;">Marketplace Deduction Mapping</h2>

    </div>
    <button class="btn primary" id="mdmSaveBtn">Save mapping</button>
  </div>`;

  if(!cols.length){
    html += `<div class="footnote">No Partner-Model combos yet — add some in "2. Partner-Model master" first.</div>`;
  } else if(!rowBrands.length || !rowItems.length){
    html += `<div class="footnote">No Brands or CODB Line Items to show yet.</div>`;
  } else {
    html += `<div style="overflow-x:auto;"><table><thead><tr><th>Brand</th><th>CODB / Expense Item</th><th style="text-align:center;">Sel All</th>`;
    cols.forEach(c=> html += `<th style="text-align:center;">${c.partner}<br><span style="font-weight:400;">${c.model}</span></th>`);
    html += `</tr></thead><tbody>`;
    rowBrands.forEach(b=>{
      rowItems.forEach(item=>{
        html += `<tr><td style="font-weight:700;">${b.name}</td><td>${item.name}</td>`;
        html += `<td style="text-align:center;"><input type="checkbox" class="mdmRowSel" data-brand="${b.id}" data-item="${item.id}"></td>`;
        cols.forEach(c=>{
          const checked = isChecked(b.id, c.id, item.id);
          html += `<td style="text-align:center;"><input type="checkbox" class="mdmCell" data-brand="${b.id}" data-pm="${c.id}" data-item="${item.id}" ${checked?'checked':''}></td>`;
        });
        html += `</tr>`;
      });
    });
    html += `</tbody></table></div>`;
  }

  container.innerHTML = html;

  container.querySelector('#mdmBrandFilter').addEventListener('change', e=>{
    container.dataset.filterBrand = e.target.value;
    renderMarketplaceDeductionMapping(container);
  });
  container.querySelector('#mdmItemFilter').addEventListener('change', e=>{
    container.dataset.filterItem = e.target.value;
    renderMarketplaceDeductionMapping(container);
  });

  container.querySelectorAll('.mdmCell').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const brandId = cb.dataset.brand, pmId = cb.dataset.pm, itemId = cb.dataset.item;
      const existingIdx = DATA.marketplaceDeductionMapping.findIndex(m=> m.brandId===brandId && m.partnerModelId===pmId && m.codbLineItemId===itemId);
      if(cb.checked && existingIdx===-1) DATA.marketplaceDeductionMapping.push({brandId, partnerModelId:pmId, codbLineItemId:itemId});
      if(!cb.checked && existingIdx>-1) DATA.marketplaceDeductionMapping.splice(existingIdx,1);
      markDirty();
    });
  });

  container.querySelectorAll('.mdmRowSel').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const brandId = cb.dataset.brand, itemId = cb.dataset.item;
      container.querySelectorAll(`.mdmCell[data-brand="${brandId}"][data-item="${itemId}"]`).forEach(cell=>{
        cell.checked = cb.checked;
        cell.dispatchEvent(new Event('change'));
      });
    });
  });

  const saveBtn = container.querySelector('#mdmSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{ markDirty(); });
}

/* ---------------------------------------------------------------
   CALCULATION ENGINE
   ----------------------------------------------------------------*/
function computeMonthlyBase(){
  // returns { channelId: { month: {qty, grossSales, netSales} } } and overall by month
  const byChMonth = {};
  const overall = {}; MONTHS.forEach(m=> overall[m] = {qty:0, grossSales:0, discount:0, netSales:0, cogs:0});
  DATA.salesInput.forEach(r=>{
    if(!r.skuId || !r.channelId || !r.month) return;
    const qty = +r.qty || 0;
    const amrp = +r.amrp || 0;
    const acogs = +r.acogs || 0;
    const discPct = +r.discountPct || 0;
    const gross = qty*amrp;
    const disc = gross*discPct/100;
    const net = gross - disc;
    const cogs = qty*acogs;
    byChMonth[r.channelId] = byChMonth[r.channelId] || {};
    byChMonth[r.channelId][r.month] = byChMonth[r.channelId][r.month] || {qty:0,grossSales:0,discount:0,netSales:0,cogs:0};
    const b = byChMonth[r.channelId][r.month];
    b.qty += qty; b.grossSales += gross; b.discount += disc; b.netSales += net; b.cogs += cogs;
    const o = overall[r.month];
    o.qty += qty; o.grossSales += gross; o.discount += disc; o.netSales += net; o.cogs += cogs;
  });
  return {byChMonth, overall};
}

function computeRateCardLines(rateCard, base){
  // returns { lineItemId: { month: amount } } and totals per month
  const lines = {};
  rateCard.forEach(r=>{
    if(!r.channelId || !r.lineItemId) return;
    const chData = base.byChMonth[r.channelId];
    lines[r.lineItemId] = lines[r.lineItemId] || {};
    MONTHS.forEach(m=>{
      const b = (chData && chData[m]) || {qty:0,grossSales:0,netSales:0};
      let amt = 0;
      const rv = +r.rateValue || 0;
      if(r.rateType === 'Value/Unit'){
        amt = b.qty * rv;
      } else { // %
        const baseVal = r.appliedOn === 'Gross Sales' ? b.grossSales : r.appliedOn === 'Qty' ? b.qty : b.netSales;
        amt = baseVal * rv/100;
      }
      lines[r.lineItemId][m] = (lines[r.lineItemId][m]||0) + amt;
    });
  });
  return lines;
}

function computeMiscLines(){
  const lines = {};
  DATA.miscInputs.forEach(r=>{
    if(!r.lineItemId || !r.month) return;
    lines[r.lineItemId] = lines[r.lineItemId] || {};
    lines[r.lineItemId][r.month] = (lines[r.lineItemId][r.month]||0) + (+r.amount||0);
  });
  return lines;
}

function sumMonth(linesObj, month){
  let t=0; Object.values(linesObj).forEach(byM=> t += (byM[month]||0)); return t;
}
function sumAll(linesObj){
  let t=0; Object.values(linesObj).forEach(byM=> MONTHS.forEach(m=> t += (byM[m]||0))); return t;
}
function lineName(id){ const li = DATA.expenseLineItems.find(x=>x.id===id); return li ? li.name : id; }
function fmt(n){
  n = Math.round(n||0);
  const neg = n<0;
  const s = Math.abs(n).toLocaleString('en-IN');
  return neg ? `(${s})` : s;
}

function buildPLModel(){
  const base = computeMonthlyBase();
  const codbLines = computeRateCardLines(DATA.codbRateCard, base);
  const cidbLines = computeRateCardLines(DATA.cidbRateCard, base);
  const miscLines = computeMiscLines();
  return {base, codbLines, cidbLines, miscLines};
}

function renderPL(container){
  const {base, codbLines, cidbLines, miscLines} = buildPLModel();
  const o = base.overall;

  function rowTotal(getter){ let t=0; MONTHS.forEach(m=> t+=getter(m)); return t; }

  const codbTotalByMKpi = m=> sumMonth(codbLines,m);
  const cidbTotalByMKpi = m=> sumMonth(cidbLines,m);
  const miscTotalByMKpi = m=> sumMonth(miscLines,m);
  const ebitdaByMKpi = m=> o[m].netSales - o[m].cogs - codbTotalByMKpi(m) - cidbTotalByMKpi(m) - miscTotalByMKpi(m);
  const fyNetSales = rowTotal(m=>o[m].netSales);
  const fyGrossMargin = rowTotal(m=>o[m].netSales - o[m].cogs);
  const fyEbitda = rowTotal(ebitdaByMKpi);
  const ebitdaPct = fyNetSales ? (fyEbitda/fyNetSales*100) : 0;
  const gmPct = fyNetSales ? (fyGrossMargin/fyNetSales*100) : 0;

  let html = `<div class="kpirow">
    <div class="kpi"><div class="kpilabel">Net Sales (FY)</div><div class="kpival">₹${fmt(fyNetSales)}</div></div>
    <div class="kpi"><div class="kpilabel">Gross Margin</div><div class="kpival">₹${fmt(fyGrossMargin)}</div><div class="kpisub">${gmPct.toFixed(1)}% of net sales</div></div>
    <div class="kpi ${fyEbitda<0?'negtone':''}"><div class="kpilabel">EBITDA (FY)</div><div class="kpival ${fyEbitda<0?'neg':''}">₹${fmt(fyEbitda)}</div><div class="kpisub">${ebitdaPct.toFixed(1)}% of net sales</div></div>
  </div>`;

  html += `<div class="panel"><table class="ledger"><thead><tr><th>₹</th>`;
  MONTHS.forEach(m=> html += `<th>${m}</th>`);
  html += `<th class="total-col">FY Total</th></tr></thead><tbody>`;

  const simpleRow = (label, getter, cls)=>{
    let r = `<tr class="${cls||''}"><td>${label}</td>`;
    MONTHS.forEach(m=> r += `<td>${fmt(getter(m))}</td>`);
    r += `<td class="total-col">${fmt(rowTotal(getter))}</td></tr>`;
    html += r;
  };

  simpleRow('Gross Sales', m=>o[m].grossSales, 'section');
  simpleRow('Less: Discount', m=>-o[m].discount);
  simpleRow('Net Sales', m=>o[m].netSales, 'subtotal');
  simpleRow('Less: ACOGS', m=>-o[m].cogs);
  simpleRow('Gross Margin', m=>o[m].netSales - o[m].cogs, 'subtotal');

  html += `<tr class="section"><td>Less: CODB</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
  Object.keys(codbLines).forEach(li=>{
    simpleRow(lineName(li), m=>-(codbLines[li][m]||0), 'lineitem neg');
  });
  const codbTotalByM = m=> sumMonth(codbLines,m);
  simpleRow('Total CODB', m=>-codbTotalByM(m), 'subtotal neg');

  simpleRow('Contribution Margin', m=>o[m].netSales - o[m].cogs - codbTotalByM(m), 'subtotal');

  html += `<tr class="section"><td>Less: CIDB Deductions</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
  Object.keys(cidbLines).forEach(li=>{
    simpleRow(lineName(li), m=>-(cidbLines[li][m]||0), 'lineitem neg');
  });
  const cidbTotalByM = m=> sumMonth(cidbLines,m);
  simpleRow('Total CIDB', m=>-cidbTotalByM(m), 'subtotal neg');

  simpleRow('Margin after CIDB', m=>o[m].netSales - o[m].cogs - codbTotalByM(m) - cidbTotalByM(m), 'subtotal');

  html += `<tr class="section"><td>Less: Misc. Opex</td>${MONTHS.map(()=>'<td></td>').join('')}<td class="total-col"></td></tr>`;
  Object.keys(miscLines).forEach(li=>{
    simpleRow(lineName(li), m=>-(miscLines[li][m]||0), 'lineitem neg');
  });
  const miscTotalByM = m=> sumMonth(miscLines,m);
  simpleRow('Total Misc. Opex', m=>-miscTotalByM(m), 'subtotal neg');

  simpleRow('EBITDA', m=>o[m].netSales - o[m].cogs - codbTotalByM(m) - cidbTotalByM(m) - miscTotalByM(m), 'grand');

  html += `</tbody></table></div>`;
  html += `<div class="footnote">Discount % and ACOGS/AMRP are keyed per SKU × channel × month in the Sales Input grid. CODB and CIDB are computed from their respective rate cards (rate × Gross Sales / Net Sales / Qty, per channel). GST is collected as an input field for reference but is excluded from this P&amp;L (it is a pass-through, not revenue).</div>`;
  container.innerHTML = html;
}

function renderCF(container){
  const {base, codbLines, cidbLines, miscLines} = buildPLModel();
  const o = base.overall;
  const ebitda = m=> o[m].netSales - o[m].cogs - sumMonth(codbLines,m) - sumMonth(cidbLines,m) - sumMonth(miscLines,m);

  const cfByCat = {};
  DATA.cashFlowItems.forEach(r=>{
    if(!r.category||!r.month) return;
    cfByCat[r.category] = cfByCat[r.category] || {};
    cfByCat[r.category][r.month] = (cfByCat[r.category][r.month]||0) + (+r.amount||0);
  });
  const catVal = (cat,m)=> (cfByCat[cat] && cfByCat[cat][m]) || 0;

  function rowTotal(getter){ let t=0; MONTHS.forEach(m=> t+=getter(m)); return t; }
  const simpleRow = (label, getter, cls)=>{
    let r = `<tr class="${cls||''}"><td>${label}</td>`;
    MONTHS.forEach(m=> r += `<td>${fmt(getter(m))}</td>`);
    r += `<td class="total-col">${fmt(rowTotal(getter))}</td></tr>`;
    return r;
  };

  const netCFByM = m=> ebitda(m) - catVal('Capex',m) - catVal('Change in Working Capital',m) + catVal('Financing Inflow / Outflow',m);
  const fyNetCF = rowTotal(netCFByM);
  const openingCash = (DATA.meta && (+DATA.meta.openingCash || 0)) || 0;
  const closingCash = openingCash + fyNetCF;

  let html = `<div class="kpirow">
    <div class="kpi"><div class="kpilabel">Net Cash Flow (FY)</div><div class="kpival ${fyNetCF<0?'neg':''}">₹${fmt(fyNetCF)}</div></div>
    <div class="kpi"><div class="kpilabel">Opening Cash</div><div class="kpival">₹${fmt(openingCash)}</div></div>
    <div class="kpi ${closingCash<0?'negtone':''}"><div class="kpilabel">Closing Cash</div><div class="kpival ${closingCash<0?'neg':''}">₹${fmt(closingCash)}</div></div>
  </div>`;

  html += `<div class="panel"><table class="ledger"><thead><tr><th>₹</th>`;
  MONTHS.forEach(m=> html += `<th>${m}</th>`);
  html += `<th class="total-col">FY Total</th></tr></thead><tbody>`;

  html += simpleRow('EBITDA (from P&amp;L)', ebitda, 'section');
  html += simpleRow('Less: Capex', m=>-catVal('Capex',m));
  html += simpleRow('Add/(less): Change in Working Capital', m=>-catVal('Change in Working Capital',m));
  html += simpleRow('Add/(less): Financing Inflow / Outflow', m=>catVal('Financing Inflow / Outflow',m));
  html += simpleRow('Net Cash Flow', m=> ebitda(m) - catVal('Capex',m) - catVal('Change in Working Capital',m) + catVal('Financing Inflow / Outflow',m), 'grand');

  html += `</tbody></table></div>`;
  html += `<div class="footnote">This is a simplified indirect cash flow: EBITDA adjusted for capex, working-capital movement and financing, keyed directly in "Cash Flow Adjustments". It does not yet model receivable/payable ageing, taxes or interest — add those as further line items when ready.</div>`;
  container.innerHTML = html;
}

/* ---------------------------------------------------------------
   NAV / RENDER
   ----------------------------------------------------------------*/
let activeTab = 'brands';
const MASTER_TAB_KEYS = MASTER_TABS.map(t=>t.key);
function render(){
  document.querySelectorAll('.navitem').forEach(b=> b.classList.toggle('active', b.dataset.tab===activeTab));
  const tab = TABS[activeTab];
  document.getElementById('panelTitle').textContent = tab.title;
  document.getElementById('panelSub').textContent = tab.desc;
  const content = document.getElementById('content');
  if(activeTab.startsWith('output')){
    tab.render(content);
  }else if(MASTER_TAB_KEYS.includes(activeTab)){
    content.innerHTML = renderMasterTabBar(activeTab) + `<div class="panel"><div id="tableHost"></div></div>`;
    wireMasterTabBar(content);
    tab.render(document.getElementById('tableHost'));
  }else{
    content.innerHTML = `<div class="panel"><div id="tableHost"></div></div>`;
    tab.render(document.getElementById('tableHost'));
  }
}

document.querySelectorAll('.navitem').forEach(btn=>{
  btn.addEventListener('click', ()=>{ activeTab = btn.dataset.tab; render(); });
});

loadData();
</script>
